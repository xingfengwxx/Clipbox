<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipbox · 方向 03 · 硬件面板</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#060607}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
@keyframes breathe3{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes blink3{0%,49%{opacity:1}50%,100%{opacity:.12}}

/* ============ board ============ */
.b3{
  width:1440px;margin:0 auto;position:relative;overflow:hidden;
  background:#0C0C0D;color:#EAE6DC;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:72px 72px;
}
.b3-in{padding:0 48px 30px;position:relative;z-index:1}
.b3-top{display:flex;align-items:center;justify-content:space-between;height:48px;font:9px var(--mono);letter-spacing:.14em;color:#7A7468;border-bottom:1px solid #232326}
.b3-logo{display:flex;align-items:center;gap:8px;color:#F2EFE7;font-weight:600;letter-spacing:.2em}
.b3-head{display:grid;grid-template-columns:1fr 316px 268px;gap:36px;padding:38px 0 26px;align-items:start}
.b3-kicker{display:flex;align-items:center;gap:9px;font:9px var(--mono);letter-spacing:.16em;color:#FF5A1F}
.b3-kicker:before{content:'';width:16px;height:1px;background:#FF5A1F}
.b3-title{font-size:62px;line-height:1.02;letter-spacing:-.045em;font-weight:600;margin-top:18px;color:#F4F1E9}
.b3-sub{margin-top:18px;font-size:13.5px;line-height:1.8;color:#9A9487;max-width:500px}
.b3-sub b{color:#D8D3C6;font-weight:500}
.b3-notes{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.b3-note{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:12px;line-height:1.65;color:#8C8678;border-top:1px solid #232326;padding-top:10px}
.b3-note b{font:9px var(--mono);color:#FF5A1F;letter-spacing:.08em;padding-top:3px}
.b3-form{margin-top:2px;font-size:11px;line-height:1.7;color:#6E695D;border-top:1px solid #232326;padding-top:11px}
.b3-form b{display:block;font:8px var(--mono);letter-spacing:.14em;color:#FF5A1F;margin-bottom:4px}

/* scope */
.b3-scope{border:1px solid #2B2B2F;background:#0F0F11;padding:0 0 10px;box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
.b3-scope-h{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #26262A;font:8px var(--mono);letter-spacing:.16em;color:#77716A}
.b3-scope-h .live{width:5px;height:5px;background:#FF5A1F;animation:breathe3 2.2s ease-in-out infinite}
.b3-scope-h .r{margin-left:auto;color:#55B97F}
.b3-scope-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid #1D1D20;font:8px var(--mono);letter-spacing:.1em;color:#6E695F}
.b3-scope-row b{font:11px var(--mono);font-weight:500;color:#EDE9DE;letter-spacing:.03em}
.b3-scope-row b.hot{color:#FF5A1F}
.b3-scope-meter{display:flex;gap:2px;padding:11px 12px 5px}
.b3-scope-meter i{flex:1;height:14px;background:#1D1D20;display:block}
.b3-scope-meter i.on{background:#FF5A1F}
.b3-scope-f{padding:2px 12px 0;font:7.5px var(--mono);letter-spacing:.08em;color:#5C574E;display:flex;justify-content:space-between}

/* bus + bench */
.b3-bus{position:relative;margin-top:6px;height:22px;border-top:1px solid #333338;display:flex;align-items:flex-start;justify-content:space-between;font:8px var(--mono);letter-spacing:.14em;color:#6B665B;padding-top:5px}
.b3-bus:after{content:'';position:absolute;top:-1px;left:0;right:0;height:5px;background-image:repeating-linear-gradient(90deg,#3A3A3F 0 1px,transparent 1px 24px);pointer-events:none}
.b3-bench{position:relative;height:800px;margin-top:0}
.b3-drop{position:absolute;top:0;width:1px;background:#2E2E33}
.b3-drop i{position:absolute;left:-2px;bottom:-2px;width:5px;height:5px;background:#FF5A1F}
.b3-dev{position:absolute}
.b3-ch{position:absolute;padding-top:6px;border-top:1px solid #2B2B2F;display:flex;align-items:baseline;gap:8px;font:8px var(--mono);letter-spacing:.06em;color:#6E695F}
.b3-ch b{color:#FF5A1F;letter-spacing:.1em;font-weight:500}
.b3-ch em{font-style:normal;margin-left:auto;color:#5C574E;letter-spacing:.1em}

/* out rack */
.b3-out{position:relative;margin-top:18px;height:22px;border-top:1px solid #333338;display:flex;align-items:flex-start;justify-content:space-between;font:8px var(--mono);letter-spacing:.14em;color:#6B665B;padding-top:5px}
.b3-out:after{content:'';position:absolute;top:-1px;left:0;right:0;height:5px;background-image:repeating-linear-gradient(90deg,#3A3A3F 0 1px,transparent 1px 24px);pointer-events:none}
.b3-lower{display:grid;grid-template-columns:auto auto 1fr;gap:30px;align-items:start;margin-top:20px}
.b3-cap{margin-top:11px;font:8.5px var(--mono);letter-spacing:.05em;color:#6E695F}
.b3-cap b{color:#EAE6DC;font-weight:500}
.b3-side{border-left:1px solid #26262A;padding-left:20px;align-self:stretch;display:flex;flex-direction:column;gap:9px}
.b3-spec{display:flex;align-items:center;gap:8px;font:8.5px var(--mono);letter-spacing:.04em;color:#77716A}
.b3-spec i{width:11px;height:11px;border:1px solid rgba(255,255,255,.14);flex:none}
.b3-spec b{color:#EAE6DC;font-weight:500;margin-right:auto}
.b3-side .b3-form{border-top:1px solid #26262A;padding-top:10px;margin-top:2px}
.b3-side .b3-warn{font:8px/1.7 var(--mono);letter-spacing:.03em;color:#5F5A50;border-top:1px solid #26262A;padding-top:9px}
.b3-end{margin-top:22px;padding-top:11px;border-top:1px solid #232326;display:flex;justify-content:space-between;font:8.5px var(--mono);letter-spacing:.1em;color:#6B665B}

/* ============ phone ============ */
.ph3{
  position:relative;height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  --bg:#0C0C0D;--panel:#131315;--panel2:#1A1A1D;--inset:#08080A;
  --ink:#F2EFE7;--ink2:#A29C90;--ink3:#615C53;
  --line:#27272B;--line2:#1B1B1E;
  --accent:#FF5A1F;--accent-dim:#3B1A0D;
  --ok:#74D89E;--warn:#E8B33C;--danger:#FF6E5C;
}
.ph3[data-light="1"]{
  --bg:#EDEAE2;--panel:#F7F4EC;--panel2:#E4E0D5;--inset:#E6E2D7;
  --ink:#141311;--ink2:#5E594D;--ink3:#8F8877;
  --line:#CBC5B6;--line2:#DBD6C9;
  --accent:#D2460F;--accent-dim:#F4DCD0;
  --ok:#2F6B45;--warn:#8A5F14;--danger:#A83A2A;
}
.ph3 .c3-head{flex:none;padding:13px 16px 0}
.ph3 .c3-link{display:flex;align-items:center;gap:6px;font:9px var(--mono);letter-spacing:.1em;color:var(--ink2)}
.ph3 .c3-dot{width:5px;height:5px;background:var(--ok);box-shadow:0 0 0 3px rgba(116,216,158,.13);animation:breathe3 2.4s ease-in-out infinite;flex:none}
.ph3 .c3-link .r{margin-left:auto;color:var(--ink3);letter-spacing:.06em}
.ph3 .c3-titlerow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:7px}
.ph3 .c3-title{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.ph3 .c3-rec{font:8px var(--mono);letter-spacing:.1em;color:var(--ink3);padding-bottom:2px}
.ph3 .c3-rec b{font-size:13px;font-weight:500;color:var(--ink);margin-right:4px}

.ph3 .c3-search{display:flex;align-items:center;gap:8px;height:34px;margin-top:11px;border:1px solid var(--line);background:var(--inset);padding:0 9px}
.ph3 .c3-q{width:15px;height:15px;display:grid;place-items:center;border:1px solid var(--line);font:8px var(--mono);color:var(--ink3);flex:none}
.ph3 .c3-search input{flex:1;border:0;background:transparent;outline:0;font:12px var(--mono);color:var(--ink);min-width:0}
.ph3 .c3-search input::placeholder{color:var(--ink3);font-family:var(--sans)}
.ph3 .c3-esc{font:7px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:1px 4px;letter-spacing:.08em;flex:none}

.ph3 .c3-comp{margin-top:10px;border:1px solid var(--line);background:var(--inset)}
.ph3 .c3-compbar{display:flex;justify-content:space-between;padding:5px 9px;border-bottom:1px solid var(--line2);font:7.5px var(--mono);letter-spacing:.11em;color:var(--ink3)}
.ph3 .c3-compbar .hot{color:var(--accent)}
.ph3 .c3-compbody{display:flex;gap:7px;padding:8px 9px 3px}
.ph3 .c3-prompt{font:11px var(--mono);color:var(--accent);padding-top:2px;flex:none;display:flex;align-items:flex-start;gap:3px}
.ph3 .c3-blk{width:6px;height:12px;background:var(--accent);display:inline-block;margin-top:1px;animation:blink3 1.15s steps(1) infinite}
.ph3 .c3-comp textarea{flex:1;min-height:42px;max-height:92px;border:0;background:transparent;resize:none;outline:0;font:12px/1.65 var(--mono);color:var(--ink);caret-color:var(--accent);padding:0}
.ph3 .c3-comp textarea::placeholder{color:var(--ink3);font-family:var(--mono);font-size:10.5px}
.ph3 .c3-compfoot{display:flex;align-items:center;gap:7px;padding:5px 9px 7px}
.ph3 .c3-bytes{font:7.5px var(--mono);letter-spacing:.03em;color:var(--ink3);white-space:nowrap}
.ph3 .c3-bytes b{font-size:9px;font-weight:500;color:var(--ink);letter-spacing:.06em}
.ph3 .c3-bytes em{font-style:normal;color:var(--ink3)}
.ph3 .c3-bytes.warn b{color:var(--warn)}
.ph3 .c3-bytes.over b{color:var(--danger)}
.ph3 .c3-meter{display:flex;gap:2px;margin-left:2px;flex:none}
.ph3 .c3-meter i{width:3px;height:6px;background:var(--line);display:block}
.ph3 .c3-meter i.on{background:var(--accent)}
.ph3 .c3-meter i.warn{background:var(--warn)}
.ph3 .c3-send{margin-left:auto;height:27px;padding:0 11px;border:1px solid #7E2C10;background:var(--accent);color:#180A05;font:8.5px var(--mono);letter-spacing:.13em;font-weight:700;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4);flex:none}
.ph3 .c3-send:disabled{background:var(--panel2);color:var(--ink3);border-color:var(--line);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);cursor:default}

.ph3 .c3-scroll{flex:1;min-height:0;overflow-y:auto;margin-top:6px}
.ph3 .c3-group{display:flex;align-items:center;gap:7px;padding:6px 16px 5px;font:7.5px var(--mono);letter-spacing:.16em;color:var(--ink3);background:var(--bg);position:sticky;top:0;z-index:2}
.ph3 .c3-group:before{content:'';width:4px;height:4px;background:var(--accent);flex:none}
.ph3 .c3-group .r{margin-left:auto;letter-spacing:.06em}
.ph3 .c3-row{display:grid;grid-template-columns:38px 1fr;gap:9px;padding:9px 16px 8px;border-top:1px solid var(--line2);position:relative}
.ph3 .c3-row.pinned{background:linear-gradient(90deg,rgba(255,90,31,.06),transparent 62%)}
.ph3 .c3-row.pinned:before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.ph3 .c3-rmeta{display:flex;flex-direction:column;gap:3px;font:7.5px var(--mono);color:var(--ink3);padding-top:2px}
.ph3 .c3-rmeta b{font-weight:500;color:var(--ink2);letter-spacing:.04em}
.ph3 .c3-rtop{display:flex;align-items:center;gap:6px;font:7px var(--mono);letter-spacing:.1em;color:var(--ink3);min-height:10px}
.ph3 .c3-rtop .pin{color:var(--accent);display:flex;align-items:center;gap:3px}
.ph3 .c3-rtop .badge{padding:1px 4px;border:1px solid currentColor}
.ph3 .c3-rtop .badge.fail{color:var(--danger)}
.ph3 .c3-rtop .badge.pend{color:var(--warn)}
.ph3 .c3-rtop .b{margin-left:auto;color:var(--ink3);letter-spacing:.04em}
.ph3 .c3-rtext{margin-top:4px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;color:var(--ink)}
.ph3 .c3-racts{display:flex;gap:1px;margin-top:5px;justify-content:flex-end;margin-right:-5px}
.ph3 .c3-act{border:0;background:none;color:var(--ink3);font:7px var(--mono);letter-spacing:.1em;padding:4px 6px;cursor:pointer}
.ph3 .c3-act:hover{color:var(--accent)}
.ph3 .c3-act.on{color:var(--accent)}
.ph3 .c3-empty{padding:36px 20px;text-align:center;font:9px var(--mono);letter-spacing:.08em;color:var(--ink3);line-height:1.8}
.ph3 .c3-empty b{display:block;color:var(--ink);font-size:11px;letter-spacing:.02em;margin-bottom:5px}
.ph3 .c3-end{text-align:center;font:7.5px var(--mono);letter-spacing:.14em;color:var(--ink3);padding:10px 0 12px}

.ph3 .c3-nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 12px 10px;border-top:1px solid var(--line);background:var(--panel)}
.ph3 .c3-key{height:52px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45);position:relative}
.ph3 .c3-key b{font:9.5px var(--mono);letter-spacing:.18em;font-weight:600}
.ph3 .c3-key span{font-size:8.5px;color:var(--ink3);letter-spacing:.04em}
.ph3 .c3-key.on{color:var(--ink);border-color:#5C2A12}
.ph3 .c3-key.on:before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--accent)}
.ph3 .c3-key.on span{color:var(--ink2)}

/* phone pages */
.ph3 .c3-page{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px}
.ph3 .c3-crumb{display:flex;align-items:center;gap:8px;font:8px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:13px 0 12px}
.ph3 .c3-crumb button{margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink2);font:7.5px var(--mono);letter-spacing:.1em;padding:3px 7px;cursor:pointer}
.ph3 .c3-h2{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.ph3 .c3-sub{font-size:11px;line-height:1.65;color:var(--ink2);margin-top:7px}
.ph3 .c3-field{margin-top:14px}
.ph3 .c3-flabel{display:flex;justify-content:space-between;font:7.5px var(--mono);letter-spacing:.14em;color:var(--ink3);margin-bottom:5px}
.ph3 .c3-input{width:100%;height:40px;border:1px solid var(--line);background:var(--inset);padding:0 10px;font:11.5px var(--mono);color:var(--ink);outline:0}
.ph3 .c3-input:focus{border-color:#7E2C10}
.ph3 .c3-code{display:flex;gap:6px;position:relative}
.ph3 .c3-cell{flex:1;height:52px;border:1px solid var(--line);background:var(--inset);display:grid;place-items:center;font:600 22px var(--mono);color:var(--ink)}
.ph3 .c3-cell.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.ph3 .c3-codeinput{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:text}
.ph3 .c3-cta{width:100%;height:44px;margin-top:16px;border:1px solid #7E2C10;background:var(--accent);color:#180A05;font:9px var(--mono);letter-spacing:.18em;font-weight:700;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.38)}
.ph3 .c3-cta:disabled{background:var(--panel2);border-color:var(--line);color:var(--ink3);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);cursor:default}
.ph3 .c3-alert{margin-top:12px;border:1px solid #6B2A16;background:rgba(255,90,31,.07);padding:9px 10px;font-size:10.5px;line-height:1.55;color:var(--ink)}
.ph3 .c3-alert b{display:block;font:7.5px var(--mono);letter-spacing:.12em;color:var(--accent);margin-bottom:3px}
.ph3 .c3-fine{font:7.5px/1.7 var(--mono);letter-spacing:.04em;color:var(--ink3);margin-top:12px}
.ph3 .c3-footpanel{margin-top:auto;border:1px solid var(--line);background:var(--panel);padding:0 10px 4px}
.ph3 .c3-fp-h{display:flex;justify-content:space-between;font:7px var(--mono);letter-spacing:.16em;color:var(--ink3);padding:7px 0 5px;border-bottom:1px solid var(--line2)}
.ph3 .c3-fp-r{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font:7.5px var(--mono);letter-spacing:.08em;color:var(--ink3);border-bottom:1px solid var(--line2)}
.ph3 .c3-fp-r:last-child{border-bottom:0}
.ph3 .c3-fp-r b{font:9px var(--mono);font-weight:500;color:var(--ink2);letter-spacing:.04em}
.ph3 .c3-fp-r b.ok{color:var(--ok)}

.ph3 .c3-sect{margin-top:15px}
.ph3 .c3-sectk{display:flex;align-items:center;gap:7px;font:7.5px var(--mono);letter-spacing:.16em;color:var(--ink3);padding-bottom:5px}
.ph3 .c3-sectk:before{content:'';width:10px;height:1px;background:var(--accent);flex:none}
.ph3 .c3-srow{display:flex;align-items:center;gap:9px;min-height:46px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink)}
.ph3 .c3-srow .v{margin-left:auto;font:8.5px var(--mono);color:var(--ink2);text-align:right;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph3 .c3-srow .v.dim{color:var(--ink3)}
.ph3 .c3-tog{width:38px;height:20px;border:1px solid var(--line);background:var(--inset);position:relative;cursor:pointer;flex:none;margin-left:auto}
.ph3 .c3-tog i{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--ink3);transition:all .15s}
.ph3 .c3-tog.on{border-color:#6B2E12}
.ph3 .c3-tog.on i{left:20px;background:var(--accent);box-shadow:0 0 8px rgba(255,90,31,.55)}
.ph3 .c3-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:2px 0 8px}
.ph3 .c3-segbtn{height:33px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font:8.5px var(--mono);letter-spacing:.08em;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.ph3 .c3-segbtn.on{border-color:#6B2E12;color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.ph3 .c3-danger{color:var(--accent);font:8px var(--mono);letter-spacing:.08em;background:none;border:0;cursor:pointer}

.ph3 .c3-toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ph3 .c3-tool{border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;padding:9px 10px;min-height:100px;display:flex;flex-direction:column;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45);cursor:pointer}
.ph3 .c3-tool .idx{font:7.5px var(--mono);color:var(--accent);letter-spacing:.14em}
.ph3 .c3-tool .nm{font:600 18px/1 var(--mono);letter-spacing:.02em;margin-top:auto}
.ph3 .c3-tool .cn{font-size:10px;color:var(--ink2);margin-top:4px}
.ph3 .c3-tool .ds{font:7px var(--mono);color:var(--ink3);margin-top:2px;letter-spacing:.04em}

if (typeof window !== 'undefined') window.BrowserWindow3 = BrowserWindow3;
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const CLIPS3 = [
  {id:'c1', time:'14:47', dev:'Pixel 8', devc:'PX8', bytes:71, pin:true, state:'synced', type:'TEXT', text:'周三产品评审结论：\n1. 分享链接默认 24 小时，可选 1 小时 / 7 天 / 阅后即焚。\n2. 离线记录先写本地库，恢复网络后按创建时间补传。'},
  {id:'c2', time:'14:31', dev:'MacBook Pro · 书房', devc:'MBP', bytes:196, pin:false, state:'synced', type:'TEXT', text:'The clipboard is the shortest path between two devices. Everything else — accounts, sync daemons, dashboards — is friction. Keep it local, keep it fast.'},
  {id:'c3', time:'14:12', dev:'Pixel 8', devc:'PX8', bytes:64, pin:false, state:'synced', type:'JSON', text:'{"build":"1.0.0","platform":"android","synced":true,"items":128}'},
  {id:'c4', time:'13:58', dev:'iPad mini', devc:'IPM', bytes:58, pin:false, state:'synced', type:'LINK', text:'https://developer.android.com/jetpack/compose/testing'},
  {id:'c5', time:'13:20', dev:'MacBook Pro · 书房', devc:'MBP', bytes:56, pin:false, state:'failed', type:'CODE', text:'ssh -i ~/.ssh/clipbox_ed25519 root@10.0.8.24 -p 2202'},
  {id:'c6', time:'昨天', dev:'未知设备', devc:'---', bytes:49, pin:false, state:'pending', type:'TEXT', text:'明早 10 点评审，记得带上接口文档。🧾'},
];
const TOOLS3 = [
  {id:'json', idx:'01', nm:'JSON', cn:'格式化 / 压缩 / 校验', ds:'STRICT PARSE'},
  {id:'b64',  idx:'02', nm:'BASE64', cn:'标准 / URL-safe', ds:'UTF-8 SAFE'},
  {id:'url',  idx:'03', nm:'URL', cn:'组件 / 整串编码', ds:'+ AS SPACE'},
  {id:'ts',   idx:'04', nm:'TIME', cn:'时间戳换算', ds:'LOCAL / UTC / ISO'},
  {id:'regex',idx:'05', nm:'REGEX', cn:'匹配与分组测试', ds:'g i m FLAGS', wide:true},
];
const bytesOf3 = s => new TextEncoder().encode(s).length;

function Mark3({size=16, color='#FF5A1F'}) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <rect x="2.5" y="6.5" width="13" height="13" rx="2.5" stroke={color} strokeWidth="1.6"/>
      <rect x="8.5" y="2.5" width="13" height="13" rx="2.5" stroke={color} strokeWidth="1.6" opacity=".45"/>
    </svg>
  );
}
function Scaled3({w,h,scale,children}){
  return (
    <div style={{width:w*scale,height:h*scale,overflow:'hidden'}}>
      <div style={{width:w,height:h,transform:`scale(${scale})`,transformOrigin:'top left'}}>{children}</div>
    </div>
  );
}

/* ===== phone ===== */
function C3Phone({initialTab='history', initialShare=false, initialDraft='', scale=0.5, presetTheme='dark'}){
  const [theme,setTheme] = useState(presetTheme);
  return (
    <div style={{width:432*scale,height:912*scale}}>
      <div style={{width:432,height:912,transform:`scale(${scale})`,transformOrigin:'top left'}}>
        <AndroidFrame3 darkMode={theme==='dark'} time="9:41" battery={82}>
          <Phone3 initialTab={initialTab} initialShare={initialShare} initialDraft={initialDraft} theme={theme} setTheme={setTheme}/>
        </AndroidFrame3>
      </div>
    </div>
  );
}

function Phone3({initialTab, initialShare, initialDraft, theme, setTheme}){
  const [tab,setTab] = useState(initialTab || 'history');
  const [list,setList] = useState(CLIPS3);
  const [q,setQ] = useState('');
  const [draft,setDraft] = useState(initialDraft || '');
  const [menu,setMenu] = useState(null);
  const [share,setShare] = useState(initialShare ? {clip:CLIPS3[0], step:1, ttl:'24h'} : null);
  const [toast,setToast] = useState('');
  const [tool,setTool] = useState(null);
  const [clipBoardOn,setClipBoardOn] = useState(true);
  const toastTimer = useRef(null);

  const ping = (t) => {
    setToast(t);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(''), 1500);
  };
  const onCopy = (c) => { ping('COPIED · '+c.bytes+' B'); };
  const onPin = (c) => {
    setList(l => l.map(x => x.id===c.id ? {...x, pin:!x.pin} : x));
    ping(c.pin ? 'UNPINNED' : 'PINNED');
  };
  const onDelete = (c) => { setList(l => l.filter(x=>x.id!==c.id)); setMenu(null); ping('DELETED'); };
  const onRetry = (c) => {
    setList(l => l.map(x => x.id===c.id ? {...x, state:'pending'} : x));
    ping('RETRY QUEUED');
  };
  const onSend = () => {
    const t = draft.trim();
    if(!t) return;
    const now = new Date();
    const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const c = {id:'n'+Date.now(), time:hm, dev:'Pixel 8', devc:'PX8', bytes:bytesOf3(t), pin:false, state:'synced', type:'TEXT', text:t};
    setList(l => [c, ...l]);
    setDraft('');
    ping('SENT · '+c.bytes+' B');
  };

  return (
    <div className="ph3" data-light={theme==='light' ? '1':'0'}>
      {tab==='history' && (
        <History3 list={list} q={q} setQ={setQ} draft={draft} setDraft={setDraft} onSend={onSend} onCopy={onCopy} onPin={onPin} onRetry={onRetry} onMore={setMenu}/>
      )}
      {tab==='pairing' && <Pairing3 onBack={()=>setTab('history')}/>}
      {tab==='settings' && <Settings3 theme={theme} setTheme={setTheme} clipboard={clipBoardOn} setClipboard={setClipBoardOn} onPair={()=>setTab('pairing')}/>}
      {tab==='toolbox' && (tool ? <ToolDetail3 tool={tool} onBack={()=>setTool(null)}/> : <Toolbox3 onOpen={setTool} onBack={()=>setTab('history')}/>)}

      <Nav3 tab={tab} setTab={(t)=>{setTab(t); if(t!=='toolbox') setTool(null);}}/>

      {menu && (
        <ActionSheet3 clip={menu} onClose={()=>setMenu(null)} onCopy={(c)=>{onCopy(c);setMenu(null);}}
          onPin={(c)=>{onPin(c);setMenu(null);}}
          onShare={(c)=>{setMenu(null); setShare({clip:c, step:1, ttl:'24h'});}}
          onDelete={onDelete}/>
      )}
      {share && (
        <Share3 clip={share.clip} step={share.step} ttl={share.ttl}
          setTtl={(t)=>setShare(s=>({...s,ttl:t}))}
          onClose={()=>setShare(null)}
          onGenerate={()=>setShare(s=>({...s,step:2}))}
          onCopy={()=>ping('LINK COPIED')}/>
      )}
      {toast && <div className="c3-toast">{toast}</div>}
    </div>
  );
}

function History3({list,q,setQ,draft,setDraft,onSend,onCopy,onPin,onRetry,onMore}){
  const bytes = bytesOf3(draft);
  const over = bytes > 65536;
  const warn = bytes > 65536*0.9 && !over;
  const shown = list.filter(c => !q || c.text.toLowerCase().includes(q.toLowerCase()) || c.dev.toLowerCase().includes(q.toLowerCase()));
  const pinned = shown.filter(c=>c.pin);
  const rest = shown.filter(c=>!c.pin);
  const segs = 18;
  const lit = Math.min(segs, Math.round(bytes/65536*segs));
  return (
    <>
      <div className="c3-head">
        <div className="c3-link">
          <span className="c3-dot"/>LINK · 3 DEV · RTT 1.2 s
          <span className="r">14:51:22</span>
        </div>
        <div className="c3-titlerow">
          <h1 className="c3-title">历史</h1>
          <div className="c3-rec"><b>128</b>RECORDS</div>
        </div>
        <div className="c3-search">
          <span className="c3-q">Q</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜索文本或设备"/>
          <span className="c3-esc">ESC</span>
        </div>
        <div className="c3-comp">
          <div className="c3-compbar"><span>TX BUFFER · UTF-8</span><span className={warn||over?'hot':''}>MAX 65 536 B</span></div>
          <div className="c3-compbody">
            <span className="c3-prompt">&gt;<i className="c3-blk"/></span>
            <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="粘贴或输入，发送到所有设备" rows={2}/>
          </div>
          <div className="c3-compfoot">
            <div className={'c3-bytes'+(over?' over':warn?' warn':'')}>
              <b>{String(bytes).padStart(6,'0')}</b><em> / 65 536 B</em>
              <span className="c3-meter">
                {Array.from({length:segs}).map((_,i)=><i key={i} className={i<lit?(over?'warn':warn?'warn':'on'):''}/>)}
              </span>
            </div>
            <button className="c3-send" disabled={!draft.trim()||over} onClick={onSend}>SEND ⏎</button>
          </div>
        </div>
      </div>

      <div className="c3-scroll">
        {shown.length===0 && (
          <div className="c3-empty"><b>没有匹配记录</b>换个关键词，或按 ESC 清空搜索。</div>
        )}
        {pinned.length>0 && <>
          <div className="c3-group">PINNED<span className="r">{String(pinned.length).padStart(2,'0')}</span></div>
          {pinned.map(c=><Row3 key={c.id} c={c} onCopy={onCopy} onPin={onPin} onRetry={onRetry} onMore={onMore}/>)}
        </>}
        {rest.length>0 && <>
          <div className="c3-group">LOG · RECENT<span className="r">{String(rest.length).padStart(2,'0')}</span></div>
          {rest.map(c=><Row3 key={c.id} c={c} onCopy={onCopy} onPin={onPin} onRetry={onRetry} onMore={onMore}/>)}
        </>}
        <div className="c3-end">END OF LOG · 128 SYNCED</div>
      </div>
    </>
  );
}

function Row3({c,onCopy,onPin,onRetry,onMore}){
  return (
    <div className={'c3-row'+(c.pin?' pinned':'')}>
      <div className="c3-rmeta"><b>{c.time}</b><span>{c.devc}</span></div>
      <div>
        <div className="c3-rtop">
          <span>{c.type}</span>
          {c.pin && <span className="pin">▲ PIN</span>}
          {c.state==='failed' && <span className="badge fail">ERR</span>}
          {c.state==='pending' && <span className="badge pend">SYNC</span>}
          <span className="b">{c.bytes} B</span>
        </div>
        <div className="c3-rtext">{c.text}</div>
        <div className="c3-racts">
          {c.state==='failed' && <button className="c3-act" onClick={()=>onRetry(c)}>RETRY</button>}
          <button className="c3-act" onClick={()=>onCopy(c)}>COPY</button>
          <button className={'c3-act'+(c.pin?' on':'')} onClick={()=>onPin(c)}>{c.pin?'UNPIN':'PIN'}</button>
          <button className="c3-act" onClick={()=>onMore(c)}>···</button>
        </div>
      </div>
    </div>
  );
}

function Nav3({tab,setTab}){
  const items = [['history','LOG','历史'],['toolbox','TOOL','工具箱'],['settings','SYS','设置']];
  return (
    <div className="c3-nav">
      {items.map(([id,k,cn])=>(
        <button key={id} className={'c3-key'+(tab===id?' on':'')} onClick={()=>setTab(id)}>
          <b>{k}</b><span>{cn}</span>
        </button>
      ))}
    </div>
  );
}

function ActionSheet3({clip,onClose,onCopy,onPin,onShare,onDelete}){
  const canShare = clip.state==='synced';
  const [confirm,setConfirm] = useState(false);
  return (
    <div className="c3-veil" onClick={onClose}>
      <div className="c3-menu" onClick={e=>e.stopPropagation()}>
        <div className="c3-menuh"><span>RECORD · {clip.time} · {clip.devc}</span><span onClick={onClose} style={{cursor:'pointer'}}>ESC</span></div>
        {!confirm ? <>
          <button className="c3-mitem" onClick={()=>onCopy(clip)}>复制文本<span className="k">{clip.bytes} B</span></button>
          <button className="c3-mitem" onClick={()=>onPin(clip)}>{clip.pin?'取消置顶':'置顶'}<span className="k">PIN</span></button>
          <button className="c3-mitem" disabled={!canShare} onClick={()=>canShare&&onShare(clip)}>生成分享链接<span className="k">{canShare?'24 H':'NOT SYNCED'}</span></button>
          <button className="c3-mitem danger" onClick={()=>setConfirm(true)}>删除<span className="k">DEL</span></button>
        </> : <>
          <div style={{fontSize:11.5,color:'var(--ink2)',lineHeight:1.65,padding:'4px 0 8px'}}>删除后不可恢复；其他设备上的同一条记录也会在下次同步时移除。</div>
          <button className="c3-mitem danger" onClick={()=>onDelete(clip)}>确认删除<span className="k">HOLD</span></button>
          <button className="c3-mitem" onClick={()=>setConfirm(false)}>取消<span className="k">ESC</span></button>
        </>}
      </div>
    </div>
  );
}

function Share3({clip,step,ttl,setTtl,onClose,onGenerate,onCopy}){
  const opts = [['1h','1 H','1 小时'],['24h','24 H','1 天'],['7d','7 D','7 天'],['burn','BURN','阅后即焚']];
  return (
    <div className="c3-veil" onClick={onClose}>
      <div className="c3-sheet" onClick={e=>e.stopPropagation()}>
        <div className="c3-sheet-h">
          <span>SHARE · {step===1?'TTL':'LINK'}</span>
          <span className="r" style={{cursor:'pointer'}} onClick={onClose}>ESC</span>
        </div>
        {step===1 ? <>
          <div className="c3-sheet-title">生成只读快照</div>
          <div className="c3-sheet-sub">链接只包含这条记录的快照，不加载脚本与外部资源。</div>
          <div className="c3-ttl">
            {opts.map(([id,b,cn])=>(
              <button key={id} className={'c3-ttlbtn'+(ttl===id?' on':'')} onClick={()=>setTtl(id)}>
                <b>{b}</b><span>{cn}</span>
              </button>
            ))}
          </div>
          <div className="c3-sheet-acts">
            <button className="c3-ghost" onClick={onClose}>取消</button>
            <button className="c3-cta" style={{flex:1}} onClick={onGenerate}>GENERATE LINK</button>
          </div>
          <div className="c3-sheet-note">READ-ONLY · NO JS · TEXT/PLAIN SNAPSHOT</div>
        </> : <>
          <div className="c3-sheet-title">链接已生成</div>
          <div className="c3-linkrow">
            <span className="c3-linkid">7fK2mQ</span>
            <div className="c3-linkmeta">{opts.find(o=>o[0]===ttl)[1]} TTL<br/>EXPIRES 11-14 15:32</div>
          </div>
          <div className="c3-linkbox">https://clip.example.com/s/7fK2mQ</div>
          <div className="c3-sheet-acts">
            <button className="c3-cta" style={{flex:1}} onClick={onCopy}>COPY LINK</button>
          </div>
          <div className="c3-sheet-note">任何拿到链接的人都能读取；到期或阅后即焚后返回 410。</div>
        </>}
      </div>
    </div>
  );
}

function Pairing3({onBack}){
  const [code,setCode] = useState('804217');
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(false);
  const [server,setServer] = useState('https://clip.example.com');
  const [name,setName] = useState('Pixel 8');
  const submit = () => {
    if(busy) return;
    setBusy(true); setErr(false);
    setTimeout(()=>{ setBusy(false); setErr(true); }, 900);
  };
  return (
    <div className="c3-page" style={{display:'flex',flexDirection:'column'}}>
      <div className="c3-crumb">SETUP / NEW DEVICE <button onClick={onBack}>← BACK</button></div>
      <h2 className="c3-h2">接入服务器</h2>
      <p className="c3-sub">输入地址与一次性配对码，这台设备会出现在所有端。配对码 10 分钟内有效。</p>
      <div className="c3-field">
        <div className="c3-flabel"><span>SERVER</span><span>HTTPS</span></div>
        <input className="c3-input" value={server} onChange={e=>setServer(e.target.value)}/>
      </div>
      <div className="c3-field">
        <div className="c3-flabel"><span>PAIR CODE</span><span>6 DIGITS</span></div>
        <div className="c3-code">
          {Array.from({length:6}).map((_,i)=>(
            <div key={i} className={'c3-cell'+(i===Math.min(code.length,5)?' on':'')}>{code[i]||''}</div>
          ))}
          <input className="c3-codeinput" value={code} inputMode="numeric"
            onChange={e=>setCode(e.target.value.replace(/\D/g,'').slice(0,6))}/>
        </div>
      </div>
      <div className="c3-field">
        <div className="c3-flabel"><span>DEVICE NAME</span><span>AUTO</span></div>
        <input className="c3-input" value={name} onChange={e=>setName(e.target.value)}/>
      </div>
      <button className="c3-cta" onClick={submit} disabled={busy||code.length!==6}>
        {busy ? 'PAIRING…' : 'PAIR DEVICE'}
      </button>
      {err && (
        <div className="c3-alert">
          <b>ERR 401 · CODE EXPIRED</b>
          配对码已过期。回到桌面端 → 设置 → 设备，重新生成一组六位码。
        </div>
      )}
      <div className="c3-fine">连续失败 5 次后进入 60 秒冷却（HTTP 429）。<br/>服务器地址更换会清空本地记录。</div>
      <div className="c3-footpanel">
        <div className="c3-fp-h"><span>LINK TEST</span><span>PRE-FLIGHT</span></div>
        <div className="c3-fp-r"><span>TRANSPORT</span><b className="ok">HTTPS · TLS 1.3</b></div>
        <div className="c3-fp-r"><span>SERVER RTT</span><b>24 ms</b></div>
        <div className="c3-fp-r"><span>SCHEMA</span><b>v3 · 128 REC</b></div>
      </div>
    </div>
  );
}

function Settings3({theme,setTheme,clipboard,setClipboard,onPair}){
  const [lang,setLang] = useState('zh');
  const [diag,setDiag] = useState(true);

          <button className={'c3-tog'+(clipboard?' on':'')} onClick={()=>setClipboard(!clipboard)}><i/></button>
        </div>

            <button key={id} className={'c3-segbtn'+(theme===id?' on':'')} onClick={()=>setTheme(id)}>{label}</button>

function TSwitch3({on,onClick}){

}

function Toolbox3({onOpen,onBack}){
  return (
    <div className="c3-page" style={{display:'flex',flexDirection:'column'}}>
      <div className="c3-crumb">TOOLBOX / LOCAL <button onClick={onBack}>← LOG</button></div>

            <span className="idx">MOD {t.idx}</span>
            <span className="nm">{t.nm}</span>

        <div className="c3-fp-r"><span>INPUT LIMIT</span><b>100 KiB</b></div>

function b64enc3(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec3(s){ return decodeURIComponent(escape(atob(s))); }

function ToolDetail3({tool,onBack}){
  const [input,setInput] = useState(
    tool.id==='json' ? '{"device":"Pixel 8","synced":true,"items":128}' :
    tool.id==='b64' ? '把这段发到 Mac：明早 10 点评审。' :
    tool.id==='url' ? 'https://clip.example.com/s/7fK2mQ?from=Pixel 8&at=14:51' :
    tool.id==='ts' ? '1763025060' :
    '(\\d{2}):(\\d{2})'
  );
  const [out,setOut] = useState('');
  const [err,setErr] = useState(false);
  const [mode,setMode] = useState('enc');
  const [flags,setFlags] = useState('g');
  const [status,setStatus] = useState('IDLE');

  const run = () => {
    try{
      let r = '';
      if(tool.id==='json'){
        const v = JSON.parse(input);
        r = JSON.stringify(v,null,2);
      } else if(tool.id==='b64'){
        r = mode==='enc' ? b64enc3(input) : b64dec3(input);
      } else if(tool.id==='url'){
        r = mode==='enc' ? encodeURIComponent(input) : decodeURIComponent(input);
      } else if(tool.id==='ts'){
        const n = Number(input.trim());
        if(!Number.isFinite(n)) throw new Error('不是合法的时间戳');
        const d = new Date(n*1000);
        r = 'LOCAL  '+d.toLocaleString('zh-CN',{hour12:false})+'\nUTC    '+d.toUTCString()+'\nISO    '+d.toISOString();
      } else if(tool.id==='regex'){
        let re;
        try{ re = new RegExp(input, flags); }catch(e){ throw new Error('正则语法错误：'+e.message); }
        const sample = '14:51 同步完成 · 13:20 重试 · 09:05 离线';
        const ms = [...sample.matchAll(re)];
        if(ms.length===0) throw new Error('没有匹配');
        r = ms.map(m=>{
          const groups = m.slice(1).map((g,i)=>`G${i+1}=${g===undefined?'∅':g}`).join('  ');
          return `@${String(m.index).padStart(2,'0')}  ${m[0]}  ${groups}`;
        }).join('\n');
      }
      setOut(r); setErr(false); setStatus('OK · '+bytesOf3(r)+' B');
    } catch(e){
      setOut('ERR · '+e.message); setErr(true); setStatus('ERR');
    }
  };
  const clear = () => { setInput(''); setOut(''); setErr(false); setStatus('IDLE'); };
  const copy = () => { if(out) setStatus('COPIED · '+bytesOf3(out)+' B'); };

  return (
    <div className="c3-page" style={{display:'flex',flexDirection:'column'}}>
      <div className="c3-crumb">MOD {tool.idx} / {tool.nm} <button onClick={onBack}>← BACK</button></div>
      <h2 className="c3-h2" style={{fontFamily:'var(--mono)',fontSize:21,letterSpacing:'.02em'}}>{tool.nm}</h2>
      <div className="c3-sub">{tool.cn} · 本地执行</div>
      <div className="c3-toolbar">
        {tool.id==='b64' || tool.id==='url' ? (
          <button className="c3-chip on" onClick={()=>setMode(mode==='enc'?'dec':'enc')}>
            MODE: {mode==='enc' ? 'ENCODE' : 'DECODE'}
          </button>
        ) : null}
        {tool.id==='regex' ? (
          ['g','i','m'].map(f=>(
            <button key={f} className={'c3-chip'+(flags.includes(f)?' on':'')}
              onClick={()=>setFlags(fs=>fs.includes(f)?fs.replace(f,''):fs+f)}>{f.toUpperCase()}</button>
          ))
        ) : null}
        {tool.id==='ts' ? (
          <button className="c3-chip" onClick={()=>setInput(String(Math.floor(Date.now()/1000)))}>NOW</button>
        ) : null}
      </div>
      <div className="c3-iolabel"><span>INPUT · UTF-8</span><span>{bytesOf3(input)} / 102 400 B</span></div>
      <textarea className="c3-io" value={input} onChange={e=>setInput(e.target.value)}/>
      <div className="c3-toolbar">
        <button className="c3-cta" style={{marginTop:0,height:38,flex:1,fontSize:8.5}} onClick={run}>RUN</button>
        <button className="c3-ghost" style={{height:38}} onClick={copy}>COPY</button>
        <button className="c3-ghost" style={{height:38}} onClick={clear}>CLR</button>
      </div>
      <div className="c3-iolabel"><span>OUTPUT</span><span className={err?'c3-status err':'c3-status'} style={{marginTop:0}}>{status}</span></div>
      <div className={'c3-out'+(err?' err':'')}>{out || '— 运行后显示结果'}</div>
    </div>
  );
}
