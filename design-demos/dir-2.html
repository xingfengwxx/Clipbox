<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipbox · 方向 02 · 剪贴卡片架</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#C3AC8A}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.32}}

/* board */
.b2{width:1440px;margin:0 auto;background:#E0C9A8;background-image:radial-gradient(#C2AB8A 1px, transparent 1px);background-size:24px 24px;color:#221E17;position:relative;overflow:hidden}
.b2-in{padding:0 48px 34px}
.b2-top{display:flex;align-items:center;justify-content:space-between;height:46px;font:9.5px var(--mono);letter-spacing:.12em;color:#6E6553;border-bottom:1px solid #C6B49A}
.b2-logo{display:flex;align-items:center;gap:8px;color:#221E17;font-weight:600;letter-spacing:.18em}
.b2-head{display:grid;grid-template-columns:1fr 380px;gap:48px;padding:38px 0 8px;align-items:start}
.b2-label{background:#FFFDF8;border-radius:4px;box-shadow:0 10px 26px rgba(64,52,34,.14),0 1px 0 rgba(255,255,255,.8) inset;padding:30px 34px 30px;transform:rotate(-.5deg);max-width:660px}
.b2-kicker{font:9px var(--mono);letter-spacing:.15em;color:#2C4FBF}
.b2-title{font-size:52px;line-height:1.1;letter-spacing:-.035em;font-weight:600;margin-top:14px}
.b2-sub{margin-top:16px;font-size:14px;line-height:1.75;color:#5C5445;max-width:540px}
.b2-notes{padding-top:6px;display:flex;flex-direction:column;gap:14px}
.b2-note{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:12.5px;line-height:1.6;color:#4A4335;border-top:1px solid #C0AD92;padding-top:10px}
.b2-note b{font:9.5px var(--mono);color:#2C4FBF;letter-spacing:.08em;padding-top:2px}
.b2-form{margin-top:4px;font-size:11.5px;line-height:1.7;color:#6E6553;border-top:1px solid #C0AD92;padding-top:12px}
.b2-form b{display:block;font:8.5px var(--mono);letter-spacing:.14em;color:#2C4FBF;margin-bottom:3px}
.b2-collage{position:relative;height:836px;margin-top:6px}
.b2-ci{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
.b2-tag{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#FFFDF8;border-radius:5px;padding:4px 9px;box-shadow:0 4px 12px rgba(64,52,34,.12);font:8.5px var(--mono);letter-spacing:.05em;color:#6E6553;white-space:nowrap}
.b2-tag b{color:#221E17;letter-spacing:.09em}
.b2-tag em{font-style:normal;color:#8C8270;font-size:8px}
.b2-index{position:absolute;background:#FFFDF8;border-radius:4px;box-shadow:0 8px 22px rgba(64,52,34,.13);padding:15px 17px;width:208px;font-family:var(--mono)}
.b2-idx-k{font-size:8px;letter-spacing:.14em;color:#2C4FBF}
.b2-idx-t{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:5px;font-family:var(--sans);color:#221E17}
.b2-idx-list{margin-top:9px;display:flex;flex-direction:column;gap:5px;font-size:8.5px;color:#5C5445}
.b2-idx-list div{display:flex;gap:7px;white-space:nowrap}
.b2-idx-list b{color:#221E17;font-weight:500}
.b2-idx-f{margin-top:10px;padding-top:8px;border-top:1px solid #E2DACD;font-size:7.5px;color:#8C8270;letter-spacing:.04em;line-height:1.6}
.b2-shelf{position:relative;margin-top:26px;padding-top:0}
.b2-shelfline{height:2px;background:#B3A086;box-shadow:0 12px 22px -10px rgba(64,52,34,.45);margin-bottom:26px}
.b2-shelfrow{display:grid;grid-template-columns:auto auto 1fr;gap:34px;align-items:start}
.b2-side{display:flex;flex-direction:column;gap:10px;border-left:1px solid #C0AD92;padding-left:22px;align-self:stretch}
.b2-spec{display:flex;align-items:center;gap:9px;font:9px var(--mono);letter-spacing:.04em;color:#6E6553}
.b2-spec i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.12);flex:none}
.b2-spec b{color:#221E17;font-weight:600;margin-right:auto}
.b2-side .b2-form{border-top:0;padding-top:2px}
.b2-share-tabs{display:flex;gap:6px;margin-bottom:10px}
.b2-share-tabs button{border:0;border-radius:999px;background:#FFFDF8;padding:5px 12px;font:8.5px var(--mono);letter-spacing:.06em;color:#6E6553;cursor:pointer;box-shadow:0 2px 6px rgba(64,52,34,.10)}
.b2-share-tabs button.on{background:#221E17;color:#FFFDF8}
.b2-end{margin-top:26px;padding-top:12px;border-top:1px solid #C0AD92;display:flex;justify-content:space-between;font:9px var(--mono);letter-spacing:.09em;color:#7C7360}

/* phone */
.ph2{
  --bg:#F5F1EA;--panel:#FFFDF9;--panel2:#EFE9DF;
  --ink:#201D18;--ink2:#6E675C;--ink3:#9C9487;
  --line:#E2DACD;--line2:#EDE6DA;
  --accent:#2C4FBF;--accent2:#1E3A91;--accent-soft:#E7ECFB;
  --ok:#2F6B45;--warn:#A8731C;--danger:#A83A2A;
  position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);
}
.ph2[data-dark="1"]{
  --bg:#171511;--panel:#211E18;--panel2:#2A251E;
  --ink:#F0EBE1;--ink2:#A79F92;--ink3:#6F695E;
  --line:#352F27;--line2:#2A251E;
  --accent:#93A9F2;--accent2:#B7C6F8;--accent-soft:#232A44;
  --ok:#7BC596;--warn:#D9A44E;--danger:#E0705C;
}
.ph2 .p-main{flex:1;min-height:0;display:flex;flex-direction:column}
.ph2 .p-head{flex:none;padding:16px 18px 4px}
.ph2 .p-status{display:flex;align-items:center;gap:6px;font:9.5px var(--mono);letter-spacing:.04em;color:var(--ink2)}
.ph2 .p-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:breathe 2.6s ease-in-out infinite;flex:none}
.ph2 .p-status span:last-child{margin-left:auto;color:var(--ink3)}
.ph2 .p-titlerow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
.ph2 .p-title{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ph2 .p-hcount{font:9px var(--mono);color:var(--ink3);letter-spacing:.08em;padding-bottom:3px}
.ph2 .p-search{display:flex;align-items:center;gap:8px;margin-top:13px;background:var(--panel2);border-radius:999px;padding:0 14px;height:38px;color:var(--ink3)}
.ph2 .p-search input{flex:1;border:0;background:transparent;outline:0;font:13px var(--sans);color:var(--ink);min-width:0}
.ph2 .p-search input::placeholder{color:var(--ink3)}
.ph2 .p-scroll,.ph2 .p-page,.ph2 .p-tools,.ph2 .p-detail{flex:1;min-height:0;overflow-y:auto}
.ph2 .p-scroll{padding:0 14px}
.ph2 .p-page{padding:2px 16px 20px}
.ph2 .p-tools{padding:2px 16px 16px}

/* composer card */
.ph2 .p-comp{background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 1px 2px rgba(50,42,30,.05);padding:11px 13px 10px;margin-top:12px}
.ph2 .p-comptop{display:flex;justify-content:space-between;gap:8px;font:8.5px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.ph2 .p-comp textarea{display:block;width:100%;min-height:56px;max-height:110px;border:0;background:transparent;resize:none;outline:0;padding:6px 0 4px;font:14px/1.55 var(--sans);color:var(--ink)}
.ph2 .p-comp textarea::placeholder{color:var(--ink3)}
.ph2 .p-compbot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph2 .p-hint{font-size:10.5px;color:var(--ink3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph2 .p-hint.warn{color:var(--warn)}
.ph2 .p-hint.over{color:var(--danger)}
.ph2 .p-send{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ph2 .p-send:disabled{background:var(--panel2);color:var(--ink3);cursor:default}

/* cards */
.ph2 .p-group{margin:14px 4px 8px;display:flex;align-items:center;gap:8px;font:8.5px var(--mono);letter-spacing:.12em;color:var(--ink3)}
.ph2 .p-group span{margin-left:auto;letter-spacing:.04em}
.ph2 .p-card{background:var(--panel);border:1px solid rgba(50,42,30,.07);border-radius:16px;box-shadow:0 1px 2px rgba(50,42,30,.05);padding:11px 13px 9px;margin-bottom:9px}
.ph2 .p-card.pinned{box-shadow:0 8px 20px rgba(50,42,30,.11);border-color:rgba(44,79,191,.16)}
.ph2 .p-cardtop{display:flex;align-items:center;gap:7px}
.ph2 .p-type{font:8px var(--mono);letter-spacing:.09em;padding:2px 6px;border-radius:999px;background:var(--panel2);color:var(--ink2);flex:none}
.ph2 .p-type.link{background:#E7ECFB;color:#2C4FBF}
.ph2 .p-type.json{background:#F3EADA;color:#7A5A2E}
.ph2 .p-type.code{background:#E5EFE6;color:#3F6B4F}
.ph2[data-dark="1"] .p-type.link{background:#232A44;color:#A9BBF6}
.ph2[data-dark="1"] .p-type.json{background:#332A1C;color:#D8B87C}
.ph2[data-dark="1"] .p-type.code{background:#20301F;color:#9BC7A6}
.ph2 .p-pintag{font:8px var(--mono);color:var(--accent);letter-spacing:.06em;display:flex;align-items:center;gap:3px}
.ph2 .p-time{margin-left:auto;font:8.5px var(--mono);color:var(--ink3);flex:none}
.ph2 .p-text{margin:7px 0 8px;font-size:14px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ph2 .p-cardfoot{display:flex;align-items:center;gap:8px}
.ph2 .p-dev{font:8.5px var(--mono);color:var(--ink2);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph2 .p-bytes{font:8.5px var(--mono);color:var(--ink3);flex:none}
.ph2 .p-badge{font:8px var(--mono);padding:1px 5px;border-radius:999px;background:var(--panel2);color:var(--ink2);flex:none}
.ph2 .p-badge.fail{background:#F7E3DE;color:var(--danger)}
.ph2 .p-badge.local{background:#F7EEDC;color:var(--warn)}
.ph2[data-dark="1"] .p-badge.fail{background:#3A211C}
.ph2[data-dark="1"] .p-badge.local{background:#33291A}
.ph2 .p-acts{margin-left:auto;display:flex;gap:1px}
.ph2 .p-act{width:29px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:999px;color:var(--ink2);cursor:pointer}
.ph2 .p-act:hover{background:var(--panel2);color:var(--ink)}
.ph2 .p-act.on{color:var(--accent)}
.ph2 .p-empty{padding:44px 20px;text-align:center}
.ph2 .p-empty-t{font-size:13.5px;font-weight:500}
.ph2 .p-empty-s{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
.ph2 .p-end{text-align:center;font:8.5px var(--mono);letter-spacing:.1em;color:var(--ink3);padding:12px 0 18px}

/* floating nav */
.ph2 .p-nav{margin:2px 14px 12px;height:58px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 10px 26px rgba(50,42,30,.12);display:grid;grid-template-columns:repeat(3,1fr);flex:none}
.ph2 .p-tab{margin:5px;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);cursor:pointer;font-size:10px;letter-spacing:.02em}
.ph2 .p-tab.on{background:var(--accent-soft);color:var(--accent)}

/* forms */
.ph2 .p-back{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--ink2);font:9px var(--mono);letter-spacing:.06em;padding:4px 0 12px;cursor:pointer}
.ph2 .p-bigtitle{font-size:25px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.ph2 .p-sub{font-size:12px;line-height:1.6;color:var(--ink2);margin-top:8px}
.ph2 .p-formcard{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px;margin-top:16px;box-shadow:0 1px 2px rgba(50,42,30,.05)}
.ph2 .p-label{font:9px var(--mono);letter-spacing:.1em;color:var(--ink2);display:flex;justify-content:space-between;margin-top:12px}
.ph2 .p-label:first-child{margin-top:0}
.ph2 .p-input{width:100%;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 12px;font:14px var(--sans);color:var(--ink);outline:0;margin-top:6px}
.ph2 .p-input:focus{border-color:var(--accent)}
.ph2 .p-code{font:600 22px/1 var(--mono);letter-spacing:.34em;text-align:center;padding-left:.34em}
.ph2 .p-primary{height:46px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-top:16px}
.ph2 .p-primary:disabled{opacity:.4;cursor:default}
.ph2 .p-err{margin-top:12px;background:#F7E3DE;border-radius:11px;padding:10px 12px;font-size:11.5px;line-height:1.55;color:#8A2F22;display:flex;gap:8px}
.ph2[data-dark="1"] .p-err{background:#3A211C;color:#F0A090}
.ph2 .p-err b{font:9px var(--mono);flex:none;padding-top:2px}
.ph2 .p-note{font-size:11px;line-height:1.6;color:var(--ink3);margin-top:14px}

/* settings */
.ph2 .p-seccard{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:4px 14px;margin-top:12px;box-shadow:0 1px 2px rgba(50,42,30,.05)}
.ph2 .p-seclbl{font:8.5px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:9px 0 0}
.ph2 .p-row{display:flex;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line2)}
.ph2 .p-row:last-child{border-bottom:0}
.ph2 button.p-row{width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.ph2 .p-row .k{font-size:13.5px;flex:none}
.ph2 .p-row .v{margin-left:auto;font:9.5px var(--mono);color:var(--ink3);text-align:right}
.ph2 .p-row .v.danger{color:var(--danger)}
.ph2 .p-row .chev{color:var(--ink3);font-size:11px;flex:none}
.ph2 .p-sw{width:42px;height:24px;border-radius:999px;background:var(--panel2);position:relative;cursor:pointer;flex:none;margin-left:auto;transition:background .15s}
.ph2 .p-sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:all .16s}
.ph2 .p-sw.on{background:var(--accent)}
.ph2 .p-sw.on i{left:21px}
.ph2 .p-seg{display:flex;background:var(--panel2);border-radius:999px;padding:3px;gap:2px;margin:6px 0 10px}
.ph2 .p-seg button{flex:1;border:0;background:none;border-radius:999px;height:32px;font-size:11.5px;color:var(--ink2);cursor:pointer}
.ph2 .p-seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(50,42,30,.12)}

/* tools grid */
.ph2 .p-toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ph2 .p-tool{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:13px 13px 12px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(50,42,30,.05);display:flex;flex-direction:column;min-height:112px}
.ph2 .p-tool .code{font:600 11px var(--mono);letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;align-self:flex-start}
.ph2 .p-tool .nm{font-size:13.5px;font-weight:500;margin-top:auto;padding-top:12px}
.ph2 .p-tool .ds{font:8.5px var(--mono);color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.ph2 .p-detail{padding:0 16px 16px;display:flex;flex-direction:column}
.ph2 .p-io{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 11px;font:11.5px/1.6 var(--mono);color:var(--ink);min-height:78px;max-height:120px;resize:none;outline:0;margin-top:12px}
.ph2 .p-out{margin-top:10px;flex:1;min-height:84px;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 11px;font:11px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.ph2 .p-btns{display:flex;gap:8px;margin-top:10px}
.ph2 .p-mini{flex:1;height:38px;border:1px solid var(--line);background:var(--panel);font-size:12px;border-radius:10px;cursor:pointer;color:var(--ink)}
.ph2 .p-mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* sheet */
.ph2 .p-veil{position:absolute;inset:0;background:rgba(28,24,17,.4);z-index:40;display:flex;align-items:flex-end}
.ph2 .p-sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.22);padding-bottom:6px;max-height:94%;overflow-y:auto}
.ph2 .p-grab{width:36px;height:4px;border-radius:999px;background:var(--line);margin:9px auto 2px}
.ph2 .p-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 18px 10px}
.ph2 .p-sheet-title{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ph2 .p-sheet-sub{font:9px var(--mono);letter-spacing:.1em;color:var(--ink3);margin-bottom:4px}
.ph2 .p-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--panel2);color:var(--ink2);cursor:pointer;flex:none}
.ph2 .p-sheet-body{padding:0 18px 8px}
.ph2 .p-opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);margin-bottom:7px;cursor:pointer;text-align:left;color:var(--ink)}
.ph2 .p-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ph2 .p-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink3);position:relative;flex:none}
.ph2 .p-opt.on .p-radio{border-color:var(--accent)}
.ph2 .p-opt.on .p-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ph2 .p-opt-l{font-size:13.5px}
.ph2 .p-opt-d{margin-left:auto;font:8.5px var(--mono);color:var(--ink3)}
.ph2 .p-sheet-note{font-size:11px;line-height:1.6;color:var(--ink3);padding:2px 2px 6px}
.ph2 .p-sheet-foot{display:flex;gap:8px;padding:8px 18px 14px}
.ph2 .p-ghost,.ph2 .p-blue{flex:1;height:43px;border-radius:12px;font-size:13px;cursor:pointer}
.ph2 .p-ghost{background:var(--panel2);border:0;color:var(--ink)}
.ph2 .p-blue{background:var(--accent);border:0;color:#fff}
.ph2 .p-url{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;font:11.5px var(--mono);word-break:break-all}
.ph2 .p-exp{font:9.5px var(--mono);color:var(--ink2);margin-top:8px}
.ph2 .p-sheet-text{padding:0 18px 8px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph2 .p-actionrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 18px;border:0;border-top:1px solid var(--line2);background:none;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}

function C2Phone({initialTab, initialShare, scale, initialDraft, presetTheme}) {
  const [theme, setTheme] = useState(presetTheme || 'light');
  const [sysDark, setSysDark] = useState(false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const m = window.matchMedia('(prefers-color-scheme: dark)');
    setSysDark(m.matches);
    const fn = e => setSysDark(e.matches);
    if(m.addEventListener) m.addEventListener('change', fn); else m.addListener(fn);
    return ()=>{ if(m.removeEventListener) m.removeEventListener('change', fn); else m.removeListener(fn); };
  },[]);
  const dark = theme==='dark' || (theme==='system' && sysDark);
  return (
    <Scaled2 w={432} h={912} scale={scale}>
      <AndroidFrame time="9:41" battery={86} darkMode={dark}>
        <Phone2 initialTab={initialTab} initialShare={initialShare} initialDraft={initialDraft} theme={theme} setTheme={setTheme} dark={dark} />
      </AndroidFrame>
    </Scaled2>
  );
}

function Phone2({initialTab='history', initialShare=false, initialDraft='', theme, setTheme, dark}) {
  const [tab, setTab] = useState(initialTab);
  const [list, setList] = useState(CLIPS2);
  const [q, setQ] = useState('');
  const [draft, setDraft] = useState(initialDraft);
  const [sheet, setSheet] = useState(null);
  const [share, setShare] = useState(initialShare ? CLIPS2[0] : null);
  const [step, setStep] = useState('options');
  const [ttl, setTtl] = useState(24);
  const [toast, setToast] = useState('');
  const tRef = useRef(null);
  const flash = m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(()=>setToast(''),1700); };
  useEffect(()=>()=>clearTimeout(tRef.current), []);
  const copy = text => { try { if(navigator.clipboard) navigator.clipboard.writeText(text); } catch(e) {} flash('已复制到剪贴板'); };
  const send = () => {
    const t = draft.trim();
    if(!t || enc2(t)>65536) return;
    setList(l => [{id:'n'+Date.now(), text:t, dev:'Pixel 8 · 本机', time:'刚刚', type:'TEXT', pinned:false, synced:false}, ...l]);
    setDraft('');
    flash('已保存到本地 · 待同步');
  };
  const pin = id => setList(l => l.map(c => c.id===id ? {...c, pinned:!c.pinned} : c));
  const del = id => { setList(l => l.filter(c => c.id!==id)); setSheet(null); flash('已删除'); };
  const openShare = clip => { setSheet(null); setShare(clip); setStep('options'); };
  const closeShare = () => { setShare(null); setStep('options'); };

  return (
    <div className="ph2" data-dark={dark?'1':'0'}>
      {tab==='history' && <History2 list={list} q={q} setQ={setQ} draft={draft} setDraft={setDraft} onSend={send} onCopy={copy} onPin={pin} onMore={setSheet} />}
      {tab==='pairing' && <Pairing2 onBack={()=>setTab('settings')} />}
      {tab==='settings' && <Settings2 theme={theme} setTheme={setTheme} onPair={()=>setTab('pairing')} />}
      {tab==='toolbox' && <Toolbox2 />}
      <Nav2 tab={tab} setTab={setTab} />
      {sheet && <ActionSheet2 clip={sheet} onClose={()=>setSheet(null)} onCopy={c=>{copy(c.text);setSheet(null);}} onPin={id=>{pin(id);setSheet(null);}} onShare={openShare} onDelete={del} />}
      {share && <Share2 clip={share} step={step} ttl={ttl} setTtl={setTtl} onClose={closeShare} onGenerate={()=>setStep('result')} onCopy={copy} />}
      {toast && <div className="p-toast">{toast}</div>}
    </div>
  );
}

function History2({list, q, setQ, draft, setDraft, onSend, onCopy, onPin, onMore}) {
  const filtered = list.filter(c => (c.text+' '+c.dev).toLowerCase().includes(q.trim().toLowerCase()));
  const pinned = filtered.filter(c => c.pinned);
  const rest = filtered.filter(c => !c.pinned);
  const bytes = enc2(draft);
  const over = bytes > 65536;
  const warn = bytes > 58982;
  return (
    <div className="p-main">
      <div className="p-head">
        <div className="p-status"><span className="p-dot"/><span>已同步 · 14:51</span><span>128 条</span></div>
        <div className="p-titlerow">
          <h2 className="p-title">历史</h2>
          <span className="p-hcount">HIST / 01</span>
        </div>
        <div className="p-search">
          <Icon2 name="search" size={13}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜索文本或设备" />
        </div>
      </div>
      <div className="p-scroll">
        <div className="p-comp">
          <div className="p-comptop"><span>新剪贴</span><span>{num2(bytes)} / 65,536 B</span></div>
          <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="粘贴或输入，然后发到所有设备…" />
          <div className="p-compbot">
            <span className={'p-hint'+(over?' over':warn?' warn':'')}>{over?'超出 64 KiB 上限':warn?'接近上限 90%':'本地优先 · 立即落盘'}</span>
            <button className="p-send" disabled={!draft.trim()||over} onClick={onSend}><Icon2 name="send" size={14}/></button>
          </div>
        </div>
        {filtered.length===0 && (
          <div className="p-empty"><div className="p-empty-t">没有找到这条剪贴</div><div className="p-empty-s">试试更短的词，或清空搜索</div></div>
        )}
        {pinned.length>0 && <div className="p-group">置顶<span>抬起 · 不参与排序</span></div>}
        {pinned.map(c=><Card2 key={c.id} clip={c} onCopy={onCopy} onPin={onPin} onMore={onMore} />)}
        {rest.length>0 && <div className="p-group">全部<span>{rest.length} 条</span></div>}
        {rest.map(c=><Card2 key={c.id} clip={c} onCopy={onCopy} onPin={onPin} onMore={onMore} />)}
        <div className="p-end">仅保留最近 90 天</div>
      </div>
    </div>
  );
}

}

function Share2({clip, step, ttl, setTtl, onClose, onGenerate, onCopy}) {
  const opts = [
    {h:1,l:'1 小时',d:'临时传一段'},
    {h:24,l:'24 小时',d:'默认'},
    {h:168,l:'7 天',d:'长期引用'},
    {h:0,l:'阅后即焚',d:'打开一次后失效'},
  ];
  const expiry = () => {
    if(ttl===0) return '阅后即焚 · 打开一次后立即失效';
    const d = new Date(Date.now()+ttl*3600e3);
    return ttl+' 小时有效 · '+d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})+' 失效';
  };
  return (
    <div className="p-veil" onClick={onClose}>
      <div className="p-sheet" onClick={e=>e.stopPropagation()}>
        <div className="p-grab"/>
        {step==='options' ? (
          <React.Fragment>
            <div className="p-sheet-head">
              <div>
                <div className="p-sheet-sub">SHARE / READ ONLY</div>
                <div className="p-sheet-title">生成分享链接</div>
              </div>
              <button className="p-x" onClick={onClose}><Icon2 name="close" size={13}/></button>
            </div>
            <div className="p-sheet-body">
              {opts.map(o=>(
                <button key={o.h} className={'p-opt'+(ttl===o.h?' on':'')} onClick={()=>setTtl(o.h)}>
                  <span className="p-radio"/><span className="p-opt-l">{o.l}</span><span className="p-opt-d">{o.d}</span>
                </button>
              ))}
              <div className="p-sheet-note">链接只包含这条记录的文本快照。到期后页面显示「已过期」，内容不再可读。</div>
            </div>
            <div className="p-sheet-foot">
              <button className="p-ghost" onClick={onClose}>取消</button>
              <button className="p-blue" onClick={onGenerate}>生成链接</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="p-sheet-head">
              <div>
                <div className="p-sheet-sub">SHARE / READY</div>
                <div className="p-sheet-title">链接已生成</div>
              </div>
              <button className="p-x" onClick={onClose}><Icon2 name="close" size={13}/></button>
            </div>
            <div className="p-sheet-body">
              <div className="p-url">https://clip.example.com/s/7fK2mQ</div>
              <div className="p-exp">{expiry()}</div>
              <div className="p-sheet-note" style={{marginTop:10}}>任何拿到链接的人都能查看这段文本。一次性链接被打开后立即失效。</div>
            </div>
            <div className="p-sheet-foot">
              <button className="p-ghost" onClick={onClose}>完成</button>
              <button className="p-blue" onClick={()=>onCopy('https://clip.example.com/s/7fK2mQ')}>复制链接</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function b64enc2(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec2(s) {
  let t = s.trim().replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function ToolDetail2({tool, onBack}) {
  const initial = tool.id==='json'
    ? '{"build":"1.0.0","platform":"android","synced":true,"items":128}'
    : tool.id==='b64'
      ? '5L2g5aW977yM5oiR5Zyo5LyY5a6d6ZuG5ou/5L2g44CC'
      : tool.id==='url'
        ? 'https://clip.example.com/s/7fK2mQ?from=android&ttl=24'
        : '';
  const [src, setSrc] = useState(initial);
  const [out, setOut] = useState('');
  const [err, setErr] = useState('');
  const [pat, setPat] = useState('\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b');
  const run = mode => {
    setErr('');
    try {
      if(tool.id==='json') {
        const obj = JSON.parse(src);
        if(mode==='min') setOut(JSON.stringify(obj));
        else {
          const pretty = JSON.stringify(obj,null,2);
          setOut(mode==='check' ? '合法 JSON · '+pretty.split('\n').length+' 行 · '+num2(enc2(pretty))+' B' : pretty);
        }
      } else if(tool.id==='b64') setOut(mode==='enc'?b64enc2(src):b64dec2(src));
      else if(tool.id==='url') setOut(mode==='enc'?encodeURIComponent(src):decodeURIComponent(src));
      else if(tool.id==='ts') {
        const d = src.trim()?new Date(Number(src.trim())):new Date();
        if(isNaN(d.getTime())) throw new Error('无法解析时间戳');
        setOut('本地  '+d.toLocaleString('zh-CN',{hour12:false})+'\nISO   '+d.toISOString()+'\n秒    '+Math.floor(d.getTime()/1000)+'\n毫秒  '+d.getTime());
      } else {
        const ms = Array.from(src.matchAll(new RegExp(pat,'g')));
        setOut(ms.length?ms.map((m,i)=>(i+1)+'. '+m[0]+'  @'+m.index).join('\n'):'没有匹配。');
      }
    } catch(e) { setErr(String(e.message||e)); setOut(''); }
  };
  return (
    <div className="p-main">
      <div className="p-head">
        <button className="p-back" onClick={onBack}><Icon2 name="back" size={12}/>工具箱 / {tool.name}</button>
        <div className="p-titlerow"><h2 className="p-title" style={{fontSize:24}}>{tool.name}</h2><span className="p-hcount">LOCAL</span></div>
      </div>
      <div className="p-detail">
        {tool.id==='re' && <input className="p-input" value={pat} onChange={e=>setPat(e.target.value)} placeholder="正则表达式" />}
        <textarea className="p-io" value={src} onChange={e=>setSrc(e.target.value)}
          placeholder={tool.id==='ts'?'留空则使用当前时间；也可输入秒或毫秒时间戳':'输入文本…'} />
        <div className="p-btns">
          {tool.id==='json' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('format')}>格式化</button>
            <button className="p-mini" onClick={()=>run('min')}>压缩</button>
            <button className="p-mini" onClick={()=>run('check')}>校验</button>
          </React.Fragment>}
          {tool.id==='b64' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('enc')}>编码</button>
            <button className="p-mini" onClick={()=>run('dec')}>解码</button>
          </React.Fragment>}
          {tool.id==='url' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('enc')}>编码</button>
            <button className="p-mini" onClick={()=>run('dec')}>解码</button>
          </React.Fragment>}
          {tool.id==='ts' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>{setSrc('');setTimeout(()=>run('now'),0);}}>现在</button>
            <button className="p-mini" onClick={()=>run('now')}>解析</button>
          </React.Fragment>}
          {tool.id==='re' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('test')}>测试</button>
            <button className="p-mini" onClick={()=>{setOut('');setErr('');}}>清空</button>
          </React.Fragment>}
        </div>
        <div className="p-out">{err?<span style={{color:'var(--danger)'}}>{err}</span>:(out||'输出会显示在这里。')}</div>
        <div className="p-note">输入 {num2(enc2(src))} B / 上限 102,400 B</div>
      </div>
    </div>
  );
}

/* desktop */
function D2Desk() {
  const [theme, setTheme] = useState('light');
  const [view, setView] = useState('history');
  const [list, setList] = useState(CLIPS2);
  const [draft, setDraft] = useState('');
  const [autoPaste, setAutoPaste] = useState(true);
  const [autoSend, setAutoSend] = useState(false);
  const [q, setQ] = useState('');
  const [toast, setToast] = useState('');
  const tRef = useRef(null);
  const dark = theme==='dark';
  const flash = m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(()=>setToast(''),1600); };
  useEffect(()=>()=>clearTimeout(tRef.current),[]);
  const send = () => {
    const t = draft.trim();
    if(!t) return;
    setList(l => [{id:'d'+Date.now(), text:t, dev:'MacBook Pro · 书房', time:'刚刚', type:'TEXT', pinned:false, synced:false}, ...l]);
    setDraft(''); flash('已发送 · 待同步到其他设备');
  };
  return (
    <MacosWindow title="Clipbox" width={1000} height={700} darkMode={dark}>
      <div className="d2" data-dark={dark?'1':'0'}>
        <aside className="d2-rail">
          <div className="d2-brand"><Mark2 size={19}/></div>
          {[['history','历史','list'],['toolbox','工具','grid'],['settings','设置','sliders']].map(([id,l,ic])=>(
            <button key={id} className={'d2-ni'+(view===id?' on':'')} onClick={()=>setView(id)}>
              <Icon2 name={ic} size={17}/><span>{l}</span>
            </button>
          ))}
          <div className="d2-railfoot"><span className="d2-dot" style={{width:6,height:6,borderRadius:'50%',background:'var(--ok)',display:'block'}}/></div>
        </aside>
        <main className="d2-main">
          {view==='history' && (
            <React.Fragment>
              <header className="d2-head">
                <div>
                  <div className="d2-kick">HISTORY / 128 ITEMS</div>
                  <h1 className="d2-title">历史</h1>
                </div>
                <div className="d2-headright">
                  <div className="d2-search"><Icon2 name="search" size={12}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜索"/></div>
                </div>
              </header>
              <div className="d2-comp">
                <div className="d2-comptop"><span>新剪贴 · {num2(enc2(draft))} / 65,536 B</span><span>⌘ ↵ 发送</span></div>
                <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="粘贴或输入，然后发到所有设备…" />
                <div className="d2-compbot">
                  <span className="d2-small">自动粘贴已开启 · 接收后立即粘贴</span>
                  <button className="d2-send" disabled={!draft.trim()||enc2(draft)>65536} onClick={send}><Icon2 name="send" size={13}/></button>
                </div>
              </div>
              <div className="d2-grid">
                {list.filter(c=>(c.text+' '+c.dev).toLowerCase().includes(q.trim().toLowerCase())).map(c=>(
                  <article className={'d2-card'+(c.pinned?' pinned':'')} key={c.id}>
                    <div className="d2-cardtop">
                      <span className={'d2-type '+c.type.toLowerCase()}>{c.type}</span>
                      <span className="d2-time">{c.time}</span>
                    </div>
                    <div className="d2-txt">{c.text}</div>
                    <div className="d2-cardfoot">
                      <span className="d2-dev">{c.dev}</span>
                      <div className="d2-acts">
                        <button className="d2-act" title="复制"><Icon2 name="copy" size={12}/></button>
                        <button className={'d2-act'+(c.pinned?' on':'')} title="置顶" onClick={()=>setList(l=>l.map(x=>x.id===c.id?{...x,pinned:!x.pinned}:x))}><Icon2 name="pin" size={12}/></button>
                        <button className="d2-act" title="更多"><Icon2 name="more" size={12}/></button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
              <div className="d2-foot"><span>本地优先 · 仅保留最近 90 天</span><span>最后同步 14:51:08</span></div>
            </React.Fragment>
          )}
          {view==='toolbox' && (
            <React.Fragment>
              <header className="d2-head">
                <div><div className="d2-kick">TOOLBOX / LOCAL ONLY</div><h1 className="d2-title">工具箱</h1></div>
                <span className="d2-small">输入上限 100 KiB</span>
              </header>
              <div className="d2-toolgrid">
                {TOOLS2.map(t=>(
                  <button key={t.id} className="d2-tool">
                    <span className="code">{t.code}</span>
                    <span className="nm">{t.name}</span>
                    <span className="ds">{t.desc}</span>
                  </button>
                ))}
              </div>
              <div className="d2-foot"><span>处理在设备内完成 · 不经过服务器</span><span>5 个工具</span></div>
            </React.Fragment>
          )}
          {view==='settings' && (
            <React.Fragment>
              <header className="d2-head">
                <div><div className="d2-kick">SETTINGS / v1.0.0</div><h1 className="d2-title">设置</h1></div>
                <span className="d2-small">已连接 · clip.example.com</span>
              </header>
              <div className="d2-set">
                <div className="d2-seccard">
                  <div className="d2-row"><span>服务器</span><span className="v">clip.example.com</span></div>
                  <div className="d2-row"><span>设备</span><span className="v">MacBook Pro · 书房</span></div>
                </div>
                <div className="d2-seccard">
                  <div className="d2-row"><span>自动粘贴</span><span className="v">接收后立即粘贴</span><span className={'d2-sw'+(autoPaste?' on':'')} onClick={()=>setAutoPaste(!autoPaste)}><i/></span></div>
                  <div className="d2-row"><span>自动发送</span><span className="v">回车立即发送</span><span className={'d2-sw'+(autoSend?' on':'')} onClick={()=>setAutoSend(!autoSend)}><i/></span></div>
                </div>
                <div className="d2-seccard">
                  <div className="d2-row"><span>外观</span>
                    <div className="d2-seg">
                      {[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([v,l])=>(
                        <button key={v} className={theme===v?'on':''} onClick={()=>setTheme(v)}>{l}</button>
                      ))}
                    </div>
                  </div>
                  <div className="d2-row"><span>语言</span><span className="v">简体中文</span></div>
                </div>
                <div className="d2-seccard">
                  <div className="d2-row"><span>诊断日志</span><span className="v">最近 7 天 · 仅本地</span></div>
                  <div className="d2-row"><span>关于 Clipbox</span><span className="v">1.0.0</span></div>
                </div>
              </div>
              <div className="d2-foot"><span>主题与语言立即生效 · 固定色板</span><span>v1.0.0</span></div>
            </React.Fragment>
          )}
        </main>
        {toast && <div className="d2-toast">{toast}</div>}
      </div>
    </MacosWindow>
  );
}

/* share page */
function SharePage2({expired}) {
  if(expired) {
    return (
      <div className="sp2">
        <div className="sp2-gone">
          <div className="sp2-gonecard">
            <div className="sp2-code">410</div>
            <h2>这个链接已经过期</h2>
            <p>分享者设置了有效期，链接到期后内容不再可读。请让对方重新生成一个链接。</p>
            <div className="sp2-foot">由 Clipbox 生成 · 只读快照</div>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="sp2">
      <div className="sp2-card">
        <div className="sp2-kicker"><span>CLIPBOX · 分享</span><span>24 小时 · 7fK2mQ</span></div>
        <h1 className="sp2-title">会议纪要 · 11 月 13 日</h1>
        <div className="sp2-body">{CLIPS2[0].text}</div>
        <div className="sp2-exp">此链接将在 24 小时后失效 · 11/14 15:32</div>
        <div className="sp2-foot">由 Clipbox 生成 · 只读快照 · 不加载外部资源</div>
      </div>
    </div>
  );
}

function ShareDemo2() {
  const [expired, setExpired] = useState(false);
  return (
    <div>
      <div className="b2-share-tabs">
        <button className={!expired?'on':''} onClick={()=>setExpired(false)}>正常</button>
        <button className={expired?'on':''} onClick={()=>setExpired(true)}>已过期</button>
      </div>
      <Scaled2 w={720} h={606} scale={0.58}>
        <BrowserWindow title="Clipbox 分享 · 7fK2mQ" url="https://clip.example.com/s/7fK2mQ" width={720} height={520}>
          <SharePage2 expired={expired}/>
        </BrowserWindow>
      </Scaled2>
    </div>
  );
}
