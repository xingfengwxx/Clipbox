<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipbox · 方向 01 · 仪器清单</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#CFD1CE;}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{font-family:inherit}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}

/* ============ board ============ */
.b1{width:1440px;margin:0 auto;background:#E2E4E1;position:relative;overflow:hidden;color:#1B1812;}
.b1:before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(92,98,94,.10) 1px,transparent 1px),linear-gradient(rgba(92,98,94,.10) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
.b1-in{position:relative;padding:0 48px 34px;}
.b1-top{display:flex;align-items:center;justify-content:space-between;height:46px;border-bottom:1px solid #B8BCB6;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#5F5A4A;}
.b1-logo{display:flex;align-items:center;gap:8px;color:#1B1812;font-weight:600;letter-spacing:.18em;}
.b1-head{display:grid;grid-template-columns:1fr 356px;gap:72px;padding:50px 0 40px;}
.b1-kicker{font:10px var(--mono);letter-spacing:.16em;color:#8A7F63;display:flex;align-items:center;gap:10px;}
.b1-kicker:before{content:"";width:22px;height:1px;background:#C2521A;}
.b1-title{font-size:62px;line-height:1.06;letter-spacing:-.035em;font-weight:600;margin-top:18px;}
.b1-sub{margin-top:18px;max-width:560px;font-size:14.5px;line-height:1.75;color:#57503F;}
.b1-principles{border-top:1px solid #B3B7B1;align-self:end;padding-top:16px;display:flex;flex-direction:column;gap:14px;}
.b1-p{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:12.5px;line-height:1.6;color:#3E392C;}
.b1-p b{font:10px var(--mono);color:#C2521A;letter-spacing:.08em;padding-top:2px;}
.b1-spec{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #B3B7B1;border-bottom:1px solid #B8B19D;}
.b1-sp{padding:11px 16px;border-right:1px solid #CBCFC9;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#5F5A4A;display:flex;align-items:center;gap:8px;}
.b1-sp:last-child{border-right:0}
.b1-sp i{width:13px;height:13px;border:1px solid rgba(0,0,0,.16);display:inline-block;flex:none}
.b1-sp b{font-weight:600;color:#1B1812}
.b1-sp span{margin-left:auto;color:#8A8474;font-size:9.5px}
.b1-ruler{height:30px;margin-top:22px;position:relative;border-bottom:1px solid #A8ADA7;background-image:repeating-linear-gradient(90deg,#A8ADA7 0 1px,transparent 1px 48px);background-repeat:no-repeat;background-size:100% 7px;background-position:0 22px;}
.b1-ruler span{position:absolute;top:0;font:8.5px var(--mono);letter-spacing:.16em;color:#7C7460}
.b1-ruler span.r{right:0}
.b1-bench{display:flex;align-items:flex-end;gap:20px;padding-top:40px;}
.b1-hero{flex:none}
.b1-stripcol{flex:1;display:flex;flex-direction:column;gap:24px;justify-content:flex-end;min-width:0}
.b1-states{width:100%;border-top:1px solid #B3B7B1;padding-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px 18px;font:9px var(--mono);letter-spacing:.03em;color:#6B634F;}
.b1-states div{display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.b1-states b{color:#C2521A;font-weight:500;letter-spacing:.1em;flex:none}
.b1-strip{display:flex;align-items:flex-end;gap:18px;flex:1;justify-content:flex-end;min-width:0}
.b1-item{display:flex;flex-direction:column;min-width:0}
.b1-cap{margin-top:11px;border-top:1px solid #ADA692;padding-top:6px;display:flex;justify-content:space-between;gap:8px;font:9px var(--mono);letter-spacing:.05em;color:#6B634F;white-space:nowrap;overflow:hidden}
.b1-cap b{font-weight:600;color:#1B1812;letter-spacing:.08em}
.b1-cap em{font-style:normal;color:#8A8474;font-size:8.5px}
.b1-foot{display:grid;grid-template-columns:auto auto 1fr;gap:28px;align-items:start;margin-top:50px;padding-top:26px;border-top:1px solid #B3B7B1;}
.b1-fitem{display:flex;flex-direction:column;min-width:0}
.b1-note{border-left:1px solid #B8B19D;padding-left:22px;font-size:12px;line-height:1.7;color:#57503F;display:flex;flex-direction:column;gap:11px;align-self:stretch;}
.b1-note b{font:9px var(--mono);letter-spacing:.12em;color:#C2521A;display:block;margin-bottom:2px}
.b1-share-tabs{display:flex;gap:0;margin-bottom:8px;border:1px solid #ADA692;width:max-content}
.b1-share-tabs button{border:0;border-right:1px solid #ADA692;background:transparent;padding:5px 12px;font:9px var(--mono);letter-spacing:.08em;color:#6B634F;cursor:pointer}
.b1-share-tabs button:last-child{border-right:0}
.b1-share-tabs button.on{background:#1B1812;color:#E9E5DA}
.b1-end{margin-top:28px;padding-top:12px;border-top:1px solid #B3B7B1;display:flex;justify-content:space-between;font:9px var(--mono);letter-spacing:.1em;color:#7C7460}

/* ============ phone shell tokens ============ */
.ph1{
  --bg:#F3F0E8;--panel:#FBF9F3;--panel2:#EAE6DA;
  --ink:#191712;--ink2:#6A6558;--ink3:#96907F;
  --line:#D6D0C0;--line2:#E3DED0;
  --accent:#C2521A;--accent2:#8F3A10;
  --ok:#2F6B45;--warn:#A8731C;--danger:#A83A2A;
  position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);
}
.ph1[data-dark="1"]{
  --bg:#17150F;--panel:#1E1B14;--panel2:#262218;
  --ink:#EDE9DC;--ink2:#A49E8D;--ink3:#6F6A5D;
  --line:#38342A;--line2:#2A2620;
  --accent:#E06A35;--accent2:#F08A55;
  --ok:#6FBF8C;--warn:#D9A44E;--danger:#E0705C;
}
.ph1 .p-main{flex:1;min-height:0;display:flex;flex-direction:column;}
.ph1 .p-head{flex:none;padding:13px 16px 12px;border-bottom:1px solid var(--line);background:var(--bg);}
.ph1 .p-status{display:flex;align-items:center;gap:6px;font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink2);}
.ph1 .p-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:breathe 2.6s ease-in-out infinite;flex:none}
.ph1 .p-synccount{margin-left:auto;color:var(--ink3);letter-spacing:.04em}
.ph1 .p-title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:9px}
.ph1 .p-title{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ph1 .p-count{font:9px var(--mono);color:var(--ink3);letter-spacing:.1em}
.ph1 .p-search{display:flex;align-items:center;gap:8px;margin-top:11px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 10px;height:37px;color:var(--ink2)}
.ph1 .p-search input{flex:1;border:0;background:transparent;outline:0;font:13px var(--sans);color:var(--ink);min-width:0}
.ph1 .p-search input::placeholder{color:var(--ink3)}
.ph1 .p-slash{font:9.5px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:1px 4px;flex:none}
.ph1 .p-scroll,.ph1 .p-page,.ph1 .p-tools,.ph1 .p-detail{flex:1;min-height:0;overflow-y:auto}
.ph1 .p-page{padding:0 16px 20px}
.ph1 .p-tools{padding:0 16px 16px}

/* composer */
.ph1 .p-comp{margin:13px 16px 4px;border:1px solid var(--ink);background:var(--panel);}
.ph1 .p-comp-top{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font:9px var(--mono);letter-spacing:.08em;color:var(--ink2);}
.ph1 .p-comp textarea{display:block;width:100%;min-height:62px;max-height:120px;border:0;background:transparent;resize:none;outline:0;padding:9px 10px;font:14px/1.55 var(--sans);color:var(--ink)}
.ph1 .p-comp textarea::placeholder{color:var(--ink3)}
.ph1 .p-comp-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);}
.ph1 .p-bytes{font:9.5px var(--mono);color:var(--ink2);letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph1 .p-bytes.warn{color:var(--warn)}
.ph1 .p-bytes.over{color:var(--danger)}
.ph1 .p-send{font:10.5px var(--mono);letter-spacing:.1em;padding:7px 15px;border:0;background:var(--accent);color:#FFF8F0;border-radius:3px;cursor:pointer;flex:none}
.ph1 .p-send:disabled{background:var(--panel2);color:var(--ink3);cursor:default}

/* list */
.ph1 .p-group{display:flex;align-items:center;gap:8px;padding:12px 16px 7px;font:9px var(--mono);letter-spacing:.12em;color:var(--ink3);}
.ph1 .p-group:after{content:"";flex:1;height:1px;background:var(--line)}
.ph1 .p-row{padding:10px 16px 8px;border-bottom:1px solid var(--line2)}
.ph1 .p-meta{display:flex;align-items:center;gap:6px;font:9.5px var(--mono);color:var(--ink2);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.ph1 .p-dev{overflow:hidden;text-overflow:ellipsis}
.ph1 .p-time{margin-left:auto;color:var(--ink3);flex:none}
.ph1 .p-text{margin:5px 0 7px;font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ph1 .p-rowfoot{display:flex;align-items:center;gap:8px}
.ph1 .p-badge{font:8.5px var(--mono);letter-spacing:.05em;padding:2px 5px;border:1px solid var(--line);color:var(--ink2);border-radius:2px;flex:none}
.ph1 .p-badge.fail{color:var(--danger);border-color:var(--danger)}
.ph1 .p-badge.local{color:var(--warn);border-color:var(--warn)}
.ph1 .p-rowfoot .p-bytes{color:var(--ink3)}
.ph1 .p-acts{margin-left:auto;display:flex;gap:0}
.ph1 .p-act{width:31px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:3px}
.ph1 .p-act:hover{background:var(--panel2);color:var(--ink)}
.ph1 .p-act.on{color:var(--accent)}
.ph1 .p-empty{padding:44px 24px;text-align:center}
.ph1 .p-empty-t{font-size:13.5px;color:var(--ink);font-weight:500}
.ph1 .p-empty-s{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
.ph1 .p-end{text-align:center;font:8.5px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:16px 0 20px}

/* nav */
.ph1 .p-nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);height:57px;flex:none;background:var(--bg)}
.ph1 .p-tab{border:0;border-right:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink3)}
.ph1 .p-tab:last-child{border-right:0}
.ph1 .p-tab .idx{font:8px var(--mono);letter-spacing:.1em}
.ph1 .p-tab .lbl{font-size:11.5px}
.ph1 .p-tab.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent);background:var(--panel)}

/* form bits */
.ph1 .p-field{margin-top:15px}
.ph1 .p-label{font:9px var(--mono);letter-spacing:.1em;color:var(--ink2);display:flex;justify-content:space-between}
.ph1 .p-input{width:100%;height:43px;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:0 12px;font:14px var(--sans);color:var(--ink);outline:0;margin-top:5px}
.ph1 .p-input:focus{border-color:var(--ink)}
.ph1 .p-code{font:600 21px/1 var(--mono);letter-spacing:.36em;text-align:center;padding-left:.36em}
.ph1 .p-btn{height:45px;width:100%;border:0;border-radius:3px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;cursor:pointer;margin-top:18px}
.ph1 .p-btn:disabled{opacity:.45;cursor:default}
.ph1 .p-err{margin-top:12px;border:1px solid var(--danger);color:var(--danger);padding:9px 11px;font-size:11.5px;line-height:1.55;border-radius:3px;display:flex;gap:8px;align-items:flex-start}
.ph1 .p-err b{font:9px var(--mono);letter-spacing:.06em;flex:none;padding-top:2px}
.ph1 .p-note{font-size:11px;line-height:1.6;color:var(--ink3);margin-top:13px}
.ph1 .p-hint{font-size:11.5px;line-height:1.6;color:var(--ink2);margin-top:8px}
.ph1 .p-backbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--ink2);font:9px var(--mono);letter-spacing:.08em;padding:0 0 10px;cursor:pointer}

/* settings */
.ph1 .p-sec{margin-top:15px;border-top:1px solid var(--line)}
.ph1 .p-seclbl{font:8.5px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:9px 0 1px}
.ph1 .p-srow{display:flex;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--line2);color:var(--ink)}
.ph1 button.p-srow{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding:0;cursor:pointer;font:inherit}
.ph1 .p-srow .k{font-size:13.5px;flex:none}
.ph1 .p-srow .v{margin-left:auto;font:10px var(--mono);color:var(--ink3);text-align:right}
.ph1 .p-srow .v.danger{color:var(--danger)}
.ph1 .p-srow .chev{color:var(--ink3);font-size:11px;flex:none}
.ph1 .p-sw{width:40px;height:22px;border:1px solid var(--ink);border-radius:3px;background:var(--panel);position:relative;cursor:pointer;flex:none;margin-left:auto}
.ph1 .p-sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--ink3);border-radius:2px;transition:all .15s}
.ph1 .p-sw.on i{left:20px;background:var(--accent)}
.ph1 .p-sw.on{border-color:var(--accent)}
.ph1 .p-seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.ph1 .p-seg button{height:35px;border:0;border-right:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--ink2);cursor:pointer}
.ph1 .p-seg button:last-child{border-right:0}
.ph1 .p-seg button.on{background:var(--ink);color:var(--bg)}

/* tools */
.ph1 .p-tool{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.ph1 .p-tool .no{font:9px var(--mono);color:var(--accent);letter-spacing:.05em}
.ph1 .p-tool .nm{font-size:13.5px;display:block}
.ph1 .p-tool .ds{font:9px var(--mono);color:var(--ink3);margin-top:2px;letter-spacing:.02em;display:block}
.ph1 .p-tool .tag{font:8.5px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:2px 5px;border-radius:2px}
.ph1 .p-detail{padding:0 16px 14px;display:flex;flex-direction:column}
.ph1 .p-io{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:9px 10px;font:12px/1.6 var(--mono);color:var(--ink);min-height:74px;max-height:120px;resize:none;outline:0;margin-top:10px}
.ph1 .p-out{margin-top:9px;flex:1;min-height:90px;overflow:auto;border:1px solid var(--line);background:var(--panel2);padding:9px 10px;font:11.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;border-radius:3px;color:var(--ink)}
.ph1 .p-actions{display:flex;gap:7px;margin-top:9px}
.ph1 .p-mini{flex:1;height:37px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;border-radius:3px;cursor:pointer;color:var(--ink)}
.ph1 .p-mini.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph1 .p-mini:disabled{opacity:.4;cursor:default}

/* modal / sheet */
.ph1 .p-veil{position:absolute;inset:0;background:rgba(20,18,12,.42);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.ph1 .p-veil.bottom{align-items:flex-end;padding:0}
.ph1 .p-dialog{width:100%;background:var(--bg);border:1px solid var(--ink);border-radius:5px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.ph1 .p-d-head{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ph1 .p-d-kicker{font:8.5px var(--mono);letter-spacing:.12em;color:var(--accent)}
.ph1 .p-d-title{font-size:17px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.ph1 .p-x{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);background:none;border-radius:3px;color:var(--ink2);cursor:pointer;flex:none}
.ph1 .p-d-body{padding:12px 16px 14px}
.ph1 .p-opt{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line2);background:none;cursor:pointer;text-align:left;color:var(--ink)}
.ph1 .p-opt:last-of-type{border-bottom:0}
.ph1 .p-radio{width:13px;height:13px;border:1px solid var(--ink3);border-radius:50%;position:relative}
.ph1 .p-opt.on .p-radio{border-color:var(--accent)}
.ph1 .p-opt.on .p-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ph1 .p-opt-l{font-size:13.5px}
.ph1 .p-opt-d{font:9px var(--mono);color:var(--ink3);letter-spacing:.03em}
.ph1 .p-d-note{font-size:11px;line-height:1.6;color:var(--ink3);margin-top:10px}
.ph1 .p-d-foot{display:flex;gap:8px;padding:12px 16px 15px;border-top:1px solid var(--line)}
.ph1 .p-ghost,.ph1 .p-primary{flex:1;height:42px;border-radius:3px;font-size:12.5px;cursor:pointer;border:1px solid var(--ink)}
.ph1 .p-ghost{background:transparent;color:var(--ink)}
.ph1 .p-primary{background:var(--ink);color:var(--bg)}
.ph1 .p-url{border:1px solid var(--line);background:var(--panel);padding:10px;font:12px var(--mono);word-break:break-all;border-radius:3px;color:var(--ink)}
.ph1 .p-exp{font:9.5px var(--mono);color:var(--ink2);margin-top:8px;letter-spacing:.02em}
.ph1 .p-sheet{width:100%;background:var(--bg);border-top:1px solid var(--ink);padding-bottom:4px}
.ph1 .p-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px 8px;font:9px var(--mono);letter-spacing:.12em;color:var(--ink3)}
.ph1 .p-sheet-text{padding:0 16px 10px;font-size:11.5px;color:var(--ink2);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph1 .p-srow-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;border:0;border-top:1px solid var(--line2);background:none;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.ph1 .p-srow-btn em{font:8.5px var(--mono);font-style:normal;color:var(--ink3);letter-spacing:.08em}
.ph1 .p-srow-btn.danger{color:var(--danger)}
.ph1 .p-srow-btn.dis{color:var(--ink3);cursor:default}
.ph1 .p-srow-btn.dis em{color:var(--ink3)}
.ph1 .p-toast{position:absolute;left:16px;right:16px;bottom:70px;background:var(--ink);color:var(--bg);font-size:11.5px;padding:9px 12px;border-radius:3px;z-index:50;text-align:center}

function C1Phone({initialTab, initialShare, scale, initialDraft, presetTheme}) {
  const [theme, setTheme] = useState(presetTheme || 'light');
  const [sysDark, setSysDark] = useState(false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const m = window.matchMedia('(prefers-color-scheme: dark)');
    setSysDark(m.matches);
    const fn = e => setSysDark(e.matches);
    if(m.addEventListener) m.addEventListener('change', fn); else m.addListener(fn);
    return ()=>{ if(m.removeEventListener) m.removeEventListener('change', fn); else m.removeListener(fn); };
  },[]);
  const dark = theme === 'dark' || (theme === 'system' && sysDark);
  return (
    <Scaled w={432} h={912} scale={scale}>
      <AndroidFrame time="9:41" battery={86} darkMode={dark}>
        <PhoneApp initialTab={initialTab} initialShare={initialShare} initialDraft={initialDraft} theme={theme} setTheme={setTheme} dark={dark} />
      </AndroidFrame>
    </Scaled>
  );
}

function PhoneApp({initialTab='history', initialShare=false, initialDraft='', theme, setTheme, dark}) {

  const [toast, setToast] = useState('');

  const flash = (m) => {
    setToast(m);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(()=>setToast(''), 1700);
  };
  useEffect(()=>()=>clearTimeout(tRef.current), []);

  const copy = (text) => {
    try { if(navigator.clipboard) navigator.clipboard.writeText(text); } catch(e) {}
    flash('已复制到剪贴板');
  };
  const send = () => {
    const t = draft.trim();
    if(!t || enc(t) > 65536) return;
    setList(l => [{id:'n'+Date.now(), text:t, dev:'Pixel 8 · 本机', time:'刚刚', pinned:false, synced:false}, ...l]);
    setDraft('');
    flash('已保存到本地 · 待同步');
  };
  const pin = id => setList(l => l.map(c => c.id===id ? {...c, pinned:!c.pinned} : c));
  const del = id => { setList(l => l.filter(c => c.id!==id)); setSheet(null); flash('已删除'); };
  const openMore = clip => setSheet(clip);
  const openShare = clip => { setSheet(null); setShare(clip); setStep('options'); };

  return (
    <div className="ph1" data-dark={dark ? '1' : '0'}>

function b64enc(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(s) {
  let t = s.trim().replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function ToolDetail1({tool, onBack}) {
  const initial = tool.id==='json'
    ? '{"build":"1.0.0","platform":"android","synced":true,"items":128}'
    : tool.id==='b64'
      ? '5L2g5aW977yM5oiR5Zyo5LyY5a6d6ZuG5ou/5L2g44CC'
      : tool.id==='url'
        ? 'https://clip.example.com/s/7fK2mQ?from=android&ttl=24'
        : '';
  const [src, setSrc] = useState(initial);
  const [out, setOut] = useState('');
  const [err, setErr] = useState('');
  const [pat, setPat] = useState('\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b');

  const run = (mode) => {
    setErr('');
    try {
      if(tool.id==='json') {
        const obj = JSON.parse(src);
        if(mode==='min') setOut(JSON.stringify(obj));
        else {
          const pretty = JSON.stringify(obj, null, 2);
          setOut(mode==='check'
            ? '合法 JSON · '+pretty.split('\n').length+' 行 · '+num(enc(pretty))+' B'
            : pretty);
        }
      } else if(tool.id==='b64') {
        setOut(mode==='enc' ? b64enc(src) : b64dec(src));
      } else if(tool.id==='url') {
        setOut(mode==='enc' ? encodeURIComponent(src) : decodeURIComponent(src));
      } else if(tool.id==='ts') {
        const d = src.trim() ? new Date(Number(src.trim())) : new Date();
        if(isNaN(d.getTime())) throw new Error('无法解析时间戳');
        setOut('本地  '+d.toLocaleString('zh-CN',{hour12:false})+'\nISO   '+d.toISOString()+'\n秒    '+Math.floor(d.getTime()/1000)+'\n毫秒  '+d.getTime());
      } else {
        const flags = 'g';
        const ms = Array.from(src.matchAll(new RegExp(pat, flags)));
        setOut(ms.length ? ms.map((m,i)=>(i+1)+'. '+m[0]+'  @'+m.index).join('\n') : '没有匹配。');
      }
    } catch(e) {
      setErr(String(e.message || e));
      setOut('');
    }
  };

  return (
    <div className="p-main">
      <div className="p-head">
        <button className="p-backbtn" onClick={onBack}><Icon name="back" size={12} />工具箱 / {tool.name}</button>
        <div className="p-title-row">
          <h2 className="p-title">{tool.name}</h2>
          <span className="p-count">LOCAL</span>
        </div>
      </div>
      <div className="p-detail">
        {tool.id==='re' && (
          <input className="p-input" value={pat} onChange={e=>setPat(e.target.value)} placeholder="正则表达式" />
        )}
        <textarea className="p-io" value={src} onChange={e=>setSrc(e.target.value)}
          placeholder={tool.id==='ts' ? '留空则使用当前时间；也可输入秒或毫秒时间戳' : '输入文本…'} />
        <div className="p-actions">
          {tool.id==='json' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('format')}>格式化</button>
            <button className="p-mini" onClick={()=>run('min')}>压缩</button>
            <button className="p-mini" onClick={()=>run('check')}>校验</button>
          </React.Fragment>}
          {tool.id==='b64' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('enc')}>编码</button>
            <button className="p-mini" onClick={()=>run('dec')}>解码</button>
          </React.Fragment>}
          {tool.id==='url' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('enc')}>编码</button>
            <button className="p-mini" onClick={()=>run('dec')}>解码</button>
          </React.Fragment>}
          {tool.id==='ts' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>{ setSrc(''); setTimeout(()=>run('now'),0); }}>现在</button>
            <button className="p-mini" onClick={()=>run('now')}>解析</button>
          </React.Fragment>}
          {tool.id==='re' && <React.Fragment>
            <button className="p-mini primary" onClick={()=>run('test')}>测试</button>
            <button className="p-mini" onClick={()=>{ setOut(''); setErr(''); }}>清空</button>
          </React.Fragment>}
        </div>
        <div className="p-out">
          {err ? <span style={{color:'var(--danger)'}}>{err}</span> : (out || '输出会显示在这里。')}
        </div>
        <div className="p-note">输入 {num(enc(src))} B / 上限 102,400 B</div>
      </div>
    </div>
  );
}

            <div className="d1-ro"><span>VERSION</span><b>1.0.0</b></div>
          </div>
        </aside>
        <main className="d1-main">
          {view==='history' && (
            <React.Fragment>
              <header className="d1-head">
                <div>
                  <div className="d1-kick">HISTORY / 128 ITEMS</div>

              </div>
              <div className="d1-table">
                <div className="d1-thead"><span>来源</span><span>内容</span><span>时间</span><span style={{textAlign:'right'}}>操作</span></div>

                <div className="d1-setrow"><span>外观</span>
                  <div className="d1-seg">
                    {[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([v,l])=>(

                  </div>
                </div>
                <div className="d1-setrow"><span>语言</span><span className="v">简体中文</span></div>
                <div className="d1-setrow"><span>诊断日志</span><span className="v">最近 7 天 · 仅本地</span></div>

            </React.Fragment>
          )}
        </main>
