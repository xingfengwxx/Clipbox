name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_site:
        description: '构建完成后把产物与清单部署到官网下载区（演练，不创建 GitHub Release）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check four version sources
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(scripts/check-release-version.sh --print-version "${GITHUB_REF_NAME}")"
          else
            version="$(scripts/check-release-version.sh --print-version)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test-server:
    name: Server tests
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run server tests
        working-directory: ClipboxServer
        run: ../scripts/gradle-retry.sh test

  test-client:
    name: Shared tests
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run shared tests
        working-directory: ClipboxClient
        run: ../scripts/gradle-retry.sh :shared:allTests

  android:
    name: Android release APK
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: ClipboxClient
        run: ../scripts/gradle-retry.sh --info :composeApp:assembleRelease
      - name: Verify signing and debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          apk="ClipboxClient/composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "release APK is debuggable" >&2
            exit 1
          fi
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "ClipboxClient/composeApp/build/outputs/apk/release/composeApp-release.apk" \
            "out/Theca-v${VERSION}-android-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-android
          path: out/Theca-v${{ env.VERSION }}-android-release.apk
          if-no-files-found: error

  linux:
    name: Linux DEB
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build DEB
        working-directory: ClipboxClient
        run: ../scripts/gradle-retry.sh :composeApp:packageDeb
      - name: Verify and stage DEB
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find ClipboxClient/composeApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          mkdir -p out
          cp "$deb" "out/Theca-v${VERSION}-linux-amd64-release.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-linux
          path: out/Theca-v${{ env.VERSION }}-linux-amd64-release.deb
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure WiX Toolset 3.14
        shell: pwsh
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.3 -y --no-progress
          }
          if (-not (Test-Path "$wixBin\candle.exe")) {
            throw "WiX candle.exe not found"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI
        working-directory: ClipboxClient
        shell: pwsh
        run: |
          # 与 Linux/macOS 一致：依赖仓库偶发不可达，整步重试一次。
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            .\gradlew.bat :composeApp:packageMsi --no-daemon
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 2) {
              Write-Host "Gradle 构建失败（第 $attempt/2 次），60 秒后重试"
              Start-Sleep -Seconds 60
            }
          }
          exit 1
      - name: Stage artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem "ClipboxClient\composeApp\build\compose\binaries\main\msi\*.msi" |
            Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $msi.FullName "out\Theca-v$($env:VERSION)-windows-amd64-release.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-windows
          path: out/Theca-v${{ env.VERSION }}-windows-amd64-release.msi
          if-no-files-found: error

  macos:
    name: macOS DMG
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Build DMG
        working-directory: ClipboxClient
        run: ../scripts/gradle-retry.sh :composeApp:packageDmg
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="ClipboxClient/composeApp/build/compose/binaries/main/dmg/Theca-${VERSION}.dmg"
          test -s "$dmg"
          mkdir -p out
          cp "$dmg" "out/Theca-v${VERSION}-macos-arm64-release.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-macos
          path: out/Theca-v${{ env.VERSION }}-macos-arm64-release.dmg
          if-no-files-found: error

  release:
    name: Publish artifacts
    permissions:
      contents: write
    needs:
      - version
      - test-server
      - test-client
      - android
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Theca-*
          merge-multiple: true
      - name: Verify artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "Theca-v${VERSION}-android-release.apk" \
            "Theca-v${VERSION}-macos-arm64-release.dmg" \
            "Theca-v${VERSION}-windows-amd64-release.msi" \
            "Theca-v${VERSION}-linux-amd64-release.deb"; do
            test -s "dist/${file}" || { echo "missing ${file}" >&2; exit 1; }
          done
          (cd dist && sha256sum Theca-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Clipbox ${GITHUB_REF_NAME}" \
              --notes "Clipbox v${VERSION} 四平台学习版产物；桌面安装包均未签名。"
          fi

  # 下载区自动上线（ADR-0009）：tag 发布后自动执行，dispatch 以 deploy_to_site 显式演练。
  # 只写服务器下载目录，不重建站点容器；清单最后切换，失败保留上一版。
  deploy-site:
    name: Deploy downloads to site
    needs:
      - version
      - release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_site == 'true')
    runs-on: ubuntu-24.04
    # 跨境单流实测仅 0.1–0.4 MB/s，四平台合计约 200 MB；并行上传后仍留足重试余量。
    timeout-minutes: 45
    concurrency:
      group: clipbox-site-deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-dry-run
          path: dist
      - name: Generate download manifest
        shell: bash
        run: |
          set -euo pipefail
          scripts/generate-downloads-manifest.sh \
            --dist dist --version "${VERSION}" --output dist/downloads.json
          cat dist/downloads.json
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "缺少 Secret：${name}" >&2
              exit 1
            fi
          done
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          # 固定主机指纹：known_hosts 来自 Secret，禁用 StrictHostKeyChecking=no。
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" true
      - name: Upload artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/deploy_key"
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15)
          target="${DEPLOY_USER}@${DEPLOY_HOST}:/srv/clipbox/downloads/"
          files=(
            "dist/Theca-v${VERSION}-android-release.apk"
            "dist/Theca-v${VERSION}-macos-arm64-release.dmg"
            "dist/Theca-v${VERSION}-windows-amd64-release.msi"
            "dist/Theca-v${VERSION}-linux-amd64-release.deb"
          )
          # 跨境单流被限速：每个产物独立一条连接并发上传；--checksum 让重跑跳过已一致文件。
          # 不加 --delete：保留历史版本产物与自建示例文件。
          pids=()
          for file in "${files[@]}"; do
            rsync -az --checksum --chmod=F644,D755 --timeout=300 -e "${SSH[*]}" \
              "$file" "$target" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "产物上传失败（并发 rsync 存在失败流）" >&2
            exit 1
          fi
          rsync -az --checksum --chmod=F644 -e "${SSH[*]}" dist/SHA256SUMS.txt "$target"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /srv/clipbox/downloads && sha256sum -c SHA256SUMS.txt'
      - name: Switch manifest last
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/deploy_key"
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ConnectTimeout=15)
          rsync -az --checksum --chmod=F644 -e "${SSH[*]}" \
            dist/downloads.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/clipbox/downloads/downloads.json.tmp"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "VERSION='${VERSION}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/clipbox/downloads
          # 临时清单先通过本站 HTTP 读到且版本正确，再原子切换。
          curl -fsS "http://127.0.0.1:8080/downloads/downloads.json.tmp" | grep -q "\"version\": \"${VERSION}\""
          if [ -f downloads.json ]; then
            cp -p downloads.json downloads.json.prev
          fi
          mv downloads.json.tmp downloads.json

          verify() {
            set -e
            local headers
            headers="$(curl -fsSI http://127.0.0.1:8080/downloads/downloads.json | tr -d '\r')"
            echo "$headers" | grep -qi '^content-type: application/json'
            echo "$headers" | grep -qi '^cache-control: no-store'
            curl -fsS http://127.0.0.1:8080/downloads/downloads.json | grep -q "\"version\": \"${VERSION}\""
            for file in \
              "Theca-v${VERSION}-android-release.apk" \
              "Theca-v${VERSION}-macos-arm64-release.dmg" \
              "Theca-v${VERSION}-windows-amd64-release.msi" \
              "Theca-v${VERSION}-linux-amd64-release.deb"; do
              expected="$(wc -c < "$file" | tr -d ' ')"
              actual="$(curl -fsSI "http://127.0.0.1:8080/downloads/$file" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')"
              if [ "$actual" != "$expected" ]; then
                echo "长度不一致：$file expected=$expected actual=$actual" >&2
                return 1
              fi
            done
            curl -fsSI http://127.0.0.1:8080/downloads/SHA256SUMS.txt | tr -d '\r' | grep -qi '^cache-control: no-store'
            curl -fsSI http://127.0.0.1:8080/downloads/theca.env.example >/dev/null
            curl -fsSI http://127.0.0.1:8080/downloads/theca-docker-compose.example.yml >/dev/null
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          }

          if ! verify; then
            if [ -f downloads.json.prev ]; then
              mv downloads.json.prev downloads.json
            else
              rm -f downloads.json
            fi
            echo "下载区校验失败，已恢复上一版清单" >&2
            exit 1
          fi
          REMOTE
      - name: Verify public URL (best effort)
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 20 --retry 5 --retry-delay 2 \
            "http://${DEPLOY_HOST}:8080/downloads/downloads.json" -o /tmp/public-downloads.json &&
            grep -q "\"version\": \"${VERSION}\"" /tmp/public-downloads.json; then
            echo "公网校验通过"
          else
            echo "::warning::公网校验失败（runner 到服务器 ingress 可能受限）；远端校验已通过"
          fi
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 下载区部署"
            echo ""
            echo "- 版本：v${VERSION:-unknown}"
            echo "- 触发：${GITHUB_EVENT_NAME}（${GITHUB_REF_NAME}）"
            echo "- 清单：http://${DEPLOY_HOST:-<host>}:8080/downloads/downloads.json"
            echo ""
            echo '```json'
            cat dist/downloads.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
