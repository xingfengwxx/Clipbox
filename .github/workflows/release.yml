name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check four version sources
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(scripts/check-release-version.sh --print-version "${GITHUB_REF_NAME}")"
          else
            version="$(scripts/check-release-version.sh --print-version)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test-server:
    name: Server tests
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run server tests
        working-directory: ClipboxServer
        run: ./gradlew test --no-daemon

  test-client:
    name: Shared tests
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run shared tests
        working-directory: ClipboxClient
        run: ./gradlew :shared:allTests --no-daemon

  android:
    name: Android release APK
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: ClipboxClient
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - name: Verify signing and debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          apk="ClipboxClient/composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "release APK is debuggable" >&2
            exit 1
          fi
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "ClipboxClient/composeApp/build/outputs/apk/release/composeApp-release.apk" \
            "out/Theca-v${VERSION}-android-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-android
          path: out/Theca-v${{ env.VERSION }}-android-release.apk
          if-no-files-found: error

  linux:
    name: Linux DEB
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build DEB
        working-directory: ClipboxClient
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - name: Verify and stage DEB
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find ClipboxClient/composeApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          mkdir -p out
          cp "$deb" "out/Theca-v${VERSION}-linux-amd64-release.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-linux
          path: out/Theca-v${{ env.VERSION }}-linux-amd64-release.deb
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure WiX Toolset 3.14
        shell: pwsh
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.3 -y --no-progress
          }
          if (-not (Test-Path "$wixBin\candle.exe")) {
            throw "WiX candle.exe not found"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI
        working-directory: ClipboxClient
        run: .\gradlew.bat :composeApp:packageMsi --no-daemon
      - name: Stage artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem "ClipboxClient\composeApp\build\compose\binaries\main\msi\*.msi" |
            Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $msi.FullName "out\Theca-v$($env:VERSION)-windows-amd64-release.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-windows
          path: out/Theca-v${{ env.VERSION }}-windows-amd64-release.msi
          if-no-files-found: error

  macos:
    name: macOS DMG
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Build DMG
        working-directory: ClipboxClient
        run: ./gradlew :composeApp:packageDmg --no-daemon
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="ClipboxClient/composeApp/build/compose/binaries/main/dmg/Theca-${VERSION}.dmg"
          test -s "$dmg"
          mkdir -p out
          cp "$dmg" "out/Theca-v${VERSION}-macos-arm64-release.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Theca-${{ env.VERSION }}-macos
          path: out/Theca-v${{ env.VERSION }}-macos-arm64-release.dmg
          if-no-files-found: error

  release:
    name: Publish artifacts
    permissions:
      contents: write
    needs:
      - version
      - test-server
      - test-client
      - android
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Theca-*
          merge-multiple: true
      - name: Verify artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "Theca-v${VERSION}-android-release.apk" \
            "Theca-v${VERSION}-macos-arm64-release.dmg" \
            "Theca-v${VERSION}-windows-amd64-release.msi" \
            "Theca-v${VERSION}-linux-amd64-release.deb"; do
            test -s "dist/${file}" || { echo "missing ${file}" >&2; exit 1; }
          done
          (cd dist && sha256sum Theca-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Clipbox ${GITHUB_REF_NAME}" \
              --notes "Clipbox v${VERSION} 四平台学习版产物；桌面安装包均未签名。"
          fi
