<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Clipbox 三端设计 · v1.0.0</title>
<style>
/* ============================================================
   Clipbox design delivery — instrument table
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--b-bg)}
body{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --display:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --mono:Menlo,Consolas,"Courier New";
  --b-bg:#CFD1CE;--b-panel:#E2E4E1;--b-panel2:#D7D9D6;
  --b-ink:#1B1812;--b-ink2:#4F4A3E;--b-ink3:#635C4D;
  --b-line:#B3B7B1;--b-line2:#C6CAC4;
  --b-accent:#963A0B;--b-accent-fill:#B0470F;
  --b-grid:rgba(92,98,94,.10);
  --b-warn:#7A4E0C;--b-ok:#2F6B45;--b-danger:#A03024;
  color:var(--b-ink);font-family:var(--sans);font-size:14px;line-height:1.6;
}
body[data-theme="dark"]{
  --b-bg:#111112;--b-panel:#1B1B1C;--b-panel2:#242425;
  --b-ink:#EDEAE2;--b-ink2:#C3BCAE;--b-ink3:#A8A294;
  --b-line:#3A3A3B;--b-line2:#2C2C2D;
  --b-accent:#F08A55;--b-accent-fill:#D96A2E;
  --b-grid:rgba(255,255,255,.045);
  --b-warn:#E0B05A;--b-ok:#7ED6A4;--b-danger:#F08A75;
}
::selection{background:rgba(176,71,15,.22)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--b-accent);outline-offset:2px}

.board{
  width:1440px;margin:0 auto;background:var(--b-panel);
  background-image:linear-gradient(var(--b-grid) 1px,transparent 1px),linear-gradient(90deg,var(--b-grid) 1px,transparent 1px);
  background-size:48px 48px;
  border-left:1px solid var(--b-line);border-right:1px solid var(--b-line);
}
.pad{padding-left:64px;padding-right:64px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:200;height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 64px;background:var(--b-panel);border-bottom:1px solid var(--b-line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{display:block}
.brand b{font:600 15px var(--sans);letter-spacing:-.01em}
.brand span{font:12px var(--mono);color:var(--b-ink3);margin-left:2px}
.controls{display:flex;align-items:center;gap:10px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl-lbl{font:12px var(--mono);color:var(--b-ink3)}
.seg{display:flex;border:1px solid var(--b-line);background:var(--b-panel)}
.seg button{
  border:0;border-right:1px solid var(--b-line);background:transparent;color:var(--b-ink2);
  padding:7px 11px;font-size:12.5px;cursor:pointer;min-height:34px;white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--b-ink);color:var(--b-panel)}
.ctrl-sep{width:1px;height:22px;background:var(--b-line);margin:0 4px}
.backtop{
  border:1px solid var(--b-line);background:transparent;color:var(--b-ink2);
  padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px;
}
.backtop:hover{color:var(--b-ink);border-color:var(--b-ink2)}

/* ---------- hero ---------- */
.hero{padding:76px 64px 0;display:grid;grid-template-columns:1fr 300px;gap:60px;align-items:end}
.hero-kicker{display:flex;flex-wrap:wrap;align-items:center;font:12px var(--mono);color:var(--b-ink3);letter-spacing:.02em}
.hero-kicker span + span{border-left:1px solid var(--b-line);padding-left:12px;margin-left:12px}
.hero-title{
  font-family:var(--display);font-size:66px;line-height:1.06;letter-spacing:-.035em;font-weight:650;
  margin-top:20px;max-width:860px;
}
.hero-sub{margin-top:24px;max-width:620px;font-size:16px;line-height:1.85;color:var(--b-ink2)}
.hero-rules{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--b-line)}
.hero-rule{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--b-line2)}
.hero-rule b{font:600 12px var(--mono);color:var(--b-ink);letter-spacing:.02em;padding-top:2px}
.hero-rule span{font-size:14px;line-height:1.65;color:var(--b-ink2)}
.hero-meta{display:flex;gap:24px;margin-top:16px;font:12px var(--mono);color:var(--b-ink3)}

/* ---------- spec band ---------- */
.specband{display:grid;grid-template-columns:repeat(6,1fr);margin:46px 64px 0;border-top:1px solid var(--b-line);border-bottom:1px solid var(--b-line)}
.spec{padding:14px 16px;border-right:1px solid var(--b-line2);display:flex;align-items:center;gap:9px;font:12px var(--mono);color:var(--b-ink3);white-space:nowrap}
.spec:last-child{border-right:0}
.spec i{width:15px;height:15px;border:1px solid rgba(0,0,0,.18);flex:none;display:block}
.spec b{font-weight:600;color:var(--b-ink)}

/* ---------- sections ---------- */
.sec{padding:66px 64px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-top:1px solid var(--b-line);padding-top:18px}
.sec-kicker{font:12px var(--mono);color:var(--b-ink3);letter-spacing:.02em}
.sec-title{font-family:var(--display);font-size:31px;font-weight:650;letter-spacing:-.025em;line-height:1.25;margin-top:7px}
.sec-note{max-width:430px;font-size:14px;line-height:1.75;color:var(--b-ink2);text-align:right}
.stage{display:flex;align-items:flex-end;gap:22px;margin-top:36px;flex-wrap:wrap}
.stage.tight{gap:20px}
.phone-item{display:flex;flex-direction:column;min-width:0}
.phone-cap{margin-top:15px;border-top:1px solid var(--b-line);padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phone-cap b{font:600 13px var(--mono);color:var(--b-ink);white-space:nowrap}
.phone-cap span{font-size:14px;color:var(--b-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone-cap em{font-style:normal;font:12px var(--mono);color:var(--b-ink3);white-space:nowrap}
.scalewrap{position:relative;flex:none}

/* ============================================================
   phone shell
   ============================================================ */
.ph{
  --bg:#F3F0E8;--panel:#FBF9F3;--panel2:#EAE6DA;
  --ink:#191712;--ink2:#5B5446;--ink3:#6B6455;
  --line:#D0CABA;--line2:#E0DBCD;
  --accent:#A8430F;--accent2:#8A3609;
  --ok:#2F6B45;--warn:#7A4E0C;--danger:#A03024;
  --mark:#F2D3BF;
  position:relative;height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  overflow:hidden;
}
.ph[data-dark="1"]{
  --bg:#17150F;--panel:#1E1B14;--panel2:#262218;
  --ink:#EDE9DC;--ink2:#B7B0A0;--ink3:#9A9384;
  --line:#3A352B;--line2:#2A2620;
  --accent:#E8823F;--accent2:#F09A63;
  --ok:#7ED6A4;--warn:#E0B05A;--danger:#F08A75;
  --mark:#4B2A18;
}
.ph .p-main{flex:1;min-height:0;display:flex;flex-direction:column}
.ph .p-scroll,.ph .p-page,.ph .p-tools,.ph .p-detail{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.ph .p-scroll::-webkit-scrollbar,.ph .p-page::-webkit-scrollbar,.ph .p-tools::-webkit-scrollbar,.ph .p-detail::-webkit-scrollbar{display:none}
.ph .p-page{padding:0 18px 20px}
.ph .p-tools{padding:0 18px 18px}

/* header */
.ph .p-head{flex:none;padding:14px 18px 13px;border-bottom:1px solid var(--line);background:var(--bg)}
.ph .p-status{display:flex;align-items:center;gap:7px;font:500 12px/1 var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden}
.ph .p-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:breathe 2.6s ease-in-out infinite;flex:none}
.ph .p-dot.off{background:var(--warn);animation:none}
.ph .p-dot.err{background:var(--danger);animation:none}
.ph .p-synccount{margin-left:auto;color:var(--ink3);flex:none}
.ph .p-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px}
.ph .p-title{font-size:27px;font-weight:650;letter-spacing:-.025em;line-height:1.1}
.ph .p-count{font:12px var(--mono);color:var(--ink3);white-space:nowrap}
.ph .p-search{display:flex;align-items:center;gap:9px;margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:0 12px;height:44px;color:var(--ink2)}
.ph .p-search input{flex:1;border:0;background:transparent;outline:0;font:14px var(--sans);color:var(--ink);min-width:0}
.ph .p-search input::placeholder{color:var(--ink3)}
.ph .p-slash{font:12px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:1px 5px;flex:none}
.ph .p-banner{display:flex;align-items:center;gap:8px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45;background:var(--panel2)}
.ph .p-banner.warn{color:var(--warn)}
.ph .p-banner.err{color:var(--danger)}
.ph .p-banner button{margin-left:auto;border:1px solid currentColor;background:none;color:inherit;font-size:12.5px;padding:6px 10px;border-radius:2px;cursor:pointer;min-height:34px}

/* composer */
.ph .p-comp{margin:14px 18px 4px;border:1px solid var(--ink);background:var(--panel)}
.ph .p-comp-top{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--ink2)}
.ph .p-comp textarea{display:block;width:100%;min-height:64px;max-height:150px;border:0;background:transparent;resize:none;outline:0;padding:10px 11px;font:15px/1.55 var(--sans);color:var(--ink)}
.ph .p-comp textarea::placeholder{color:var(--ink3)}
.ph .p-comp-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;border-top:1px solid var(--line)}
.ph .p-bytes{font:12px var(--mono);color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .p-bytes.warn{color:var(--warn)}
.ph .p-bytes.over{color:var(--danger)}
.ph .p-send{font-size:14px;font-weight:500;letter-spacing:.02em;padding:9px 18px;border:0;background:var(--accent);color:#FFF8F0;border-radius:3px;cursor:pointer;flex:none;min-height:44px}
.ph .p-send:disabled{background:var(--panel2);color:var(--ink3);cursor:default}
.ph .p-send.ghost{background:var(--ink);color:var(--bg)}

/* list */
.ph .p-group{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;font:12px var(--mono);color:var(--ink3)}
.ph .p-group:after{content:"";flex:1;height:1px;background:var(--line)}
.ph .p-row{padding:12px 18px 8px;border-bottom:1px solid var(--line2)}
.ph .p-meta{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden}
.ph .p-dev{overflow:hidden;text-overflow:ellipsis}
.ph .p-time{margin-left:auto;color:var(--ink3);flex:none}
.ph .p-text{margin:7px 0 2px;font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ph .p-rowfoot{display:flex;align-items:center;gap:8px;min-height:46px}
.ph .p-badge{font:12px var(--mono);letter-spacing:.01em;padding:2px 6px;border:1px solid var(--line);color:var(--ink2);border-radius:2px;flex:none;white-space:nowrap}
.ph .p-badge.fail{color:var(--danger);border-color:var(--danger)}
.ph .p-badge.local{color:var(--warn);border-color:var(--warn)}
.ph .p-rowfoot .p-bytes{color:var(--ink3)}
.ph .p-acts{margin-left:auto;display:flex}
.ph .p-act{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:3px}
.ph .p-act:hover{background:var(--panel2);color:var(--ink)}
.ph .p-act.on{color:var(--accent)}
.ph .p-failrow{display:flex;align-items:center;gap:10px;padding:0 18px 12px;border-bottom:1px solid var(--line2)}
.ph .p-failrow span{font-size:13px;color:var(--danger);line-height:1.4}
.ph .p-failrow button{margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink2);font-size:13px;padding:7px 12px;border-radius:2px;cursor:pointer;min-height:38px;white-space:nowrap}

/* empty */
.ph .p-empty{padding:46px 28px 30px;text-align:center}
.ph .p-empty svg{display:block;margin:0 auto 20px;color:var(--ink3)}
.ph .p-empty-t{font-size:17px;color:var(--ink);font-weight:600}
.ph .p-empty-s{font-size:14px;color:var(--ink3);margin-top:8px;line-height:1.6}
.ph .p-empty-btn{margin-top:20px;min-height:48px;padding:0 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;border-radius:3px;cursor:pointer}
.ph .p-end{text-align:center;font:12px var(--mono);color:var(--ink3);padding:18px 0 22px}

/* nav */
.ph .p-nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);height:64px;flex:none;background:var(--bg)}
.ph .p-tab{border:0;border-right:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);font-size:13.5px}
.ph .p-tab:last-child{border-right:0}
.ph .p-tab.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--accent);background:var(--panel);font-weight:500}
.ph .p-tab:hover{color:var(--ink2)}

/* forms */
.ph .p-field{margin-top:18px}
.ph .p-label{font:12px var(--mono);color:var(--ink2);display:flex;justify-content:space-between;gap:8px;line-height:1.4}
.ph .p-input{width:100%;height:50px;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:0 13px;font:15px var(--sans);color:var(--ink);outline:0;margin-top:6px}
.ph .p-input:focus{border-color:var(--ink)}
.ph .p-code{font:600 24px/1 var(--mono);letter-spacing:.34em;text-align:center;padding-left:.34em}
.ph .p-btn{height:52px;width:100%;border:0;border-radius:3px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:500;cursor:pointer;margin-top:20px}
.ph .p-btn:disabled{opacity:1;background:var(--panel2);color:var(--ink2);cursor:default}
.ph .p-err{margin-top:14px;border:1px solid var(--danger);color:var(--danger);padding:11px 13px;font-size:14px;line-height:1.55;border-radius:3px;display:flex;gap:9px;align-items:flex-start}
.ph .p-err b{font:12px var(--mono);flex:none;padding-top:1px}
.ph .p-note{font-size:14px;line-height:1.65;color:var(--ink3);margin-top:14px}
.ph .p-hint{font-size:14px;line-height:1.6;color:var(--ink2);margin-top:9px}
.ph .p-backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-size:13px;padding:0 0 12px;cursor:pointer;min-height:42px}
.ph .p-backbtn:hover{color:var(--ink)}

/* settings */
.ph .p-sec{margin-top:18px;border-top:1px solid var(--line)}
.ph .p-seclbl{font:12px var(--mono);color:var(--ink3);padding:10px 0 2px}
.ph .p-srow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2);color:var(--ink);width:100%}
.ph button.p-srow{background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;font:inherit;padding:0}
.ph .p-srow .k{font-size:15px;flex:none}
.ph .p-srow .v{margin-left:auto;font:12px var(--mono);color:var(--ink3);text-align:right;line-height:1.4}
.ph .p-srow .v.danger{color:var(--danger)}
.ph .p-srow .v.ok{color:var(--ok)}
.ph .p-sw{width:46px;height:26px;border:1px solid var(--ink);border-radius:3px;background:var(--panel);position:relative;cursor:pointer;flex:none;margin-left:auto}
.ph .p-sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink3);border-radius:2px;transition:all .15s}
.ph .p-sw.on i{left:22px;background:var(--accent)}
.ph .p-sw.on{border-color:var(--accent)}
.ph .p-seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.ph .p-seg button{height:46px;border:0;border-right:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink2);cursor:pointer}
.ph .p-seg button:last-child{border-right:0}
.ph .p-seg button.on{background:var(--ink);color:var(--bg)}

/* tools */
.ph .p-tool{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:var(--ink);width:100%;min-height:68px}
.ph .p-tool .nm{font-size:15.5px;display:block;font-weight:500}
.ph .p-tool .ds{font:12px var(--mono);color:var(--ink3);margin-top:3px;display:block}
.ph .p-tool .tag{font:12px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:3px 6px;border-radius:2px;white-space:nowrap}
.ph .p-tool:hover .nm{color:var(--accent)}
.ph .p-detail{padding:0 18px 16px;display:flex;flex-direction:column}
.ph .p-io{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:10px 11px;font:14px/1.6 var(--mono);color:var(--ink);min-height:96px;max-height:150px;resize:none;outline:0;margin-top:10px}
.ph .p-out{margin-top:10px;flex:1;min-height:110px;overflow:auto;border:1px solid var(--line);background:var(--panel2);padding:10px 11px;font:14px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;border-radius:3px;color:var(--ink)}
.ph .p-out.err{color:var(--danger)}
.ph .p-out mark{background:var(--mark);color:var(--ink);border-radius:1px}
.ph .p-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ph .p-mini{flex:1;min-width:0;height:46px;border:1px solid var(--line);background:var(--panel);font-size:14px;border-radius:3px;cursor:pointer;color:var(--ink);padding:0 10px;white-space:nowrap}
.ph .p-mini.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph .p-mini:disabled{opacity:.4;cursor:default}
.ph .p-flagrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ph .p-flag{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:13px;padding:8px 11px;border-radius:2px;cursor:pointer;min-height:40px}
.ph .p-flag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph .p-kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.ph .p-kv b{font:12px var(--mono);color:var(--ink3);font-weight:500;flex:none;padding-top:2px}
.ph .p-kv span{font:14px var(--mono);color:var(--ink);text-align:right;word-break:break-all}

/* modal / sheet */
.ph .p-veil{position:absolute;inset:0;background:rgba(20,18,12,.46);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.ph .p-veil.bottom{align-items:flex-end;padding:0}
.ph .p-dialog{width:100%;max-height:86%;overflow:auto;background:var(--bg);border:1px solid var(--ink);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.ph .p-d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 13px;border-bottom:1px solid var(--line)}
.ph .p-d-kicker{font:12px var(--mono);color:var(--accent);line-height:1.4}
.ph .p-d-title{font-size:19px;font-weight:650;margin-top:5px;letter-spacing:-.01em;line-height:1.3}
.ph .p-x{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:none;border-radius:3px;color:var(--ink2);cursor:pointer;flex:none}
.ph .p-d-body{padding:14px 18px 16px}
.ph .p-d-foot{display:flex;gap:10px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.ph .p-ghost,.ph .p-primary{flex:1;min-height:48px;border-radius:3px;font-size:15px;cursor:pointer;border:1px solid var(--ink);white-space:nowrap}
.ph .p-ghost{background:transparent;color:var(--ink)}
.ph .p-primary{background:var(--ink);color:var(--bg)}
.ph .p-primary.danger{background:var(--danger);border-color:var(--danger);color:#FFF6F3}
.ph .p-primary:disabled{opacity:1;background:var(--panel2);color:var(--ink2);border-color:var(--line);cursor:default}
.ph .p-opt{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 0;border:0;border-bottom:1px solid var(--line2);background:none;cursor:pointer;text-align:left;color:var(--ink)}
.ph .p-opt:last-of-type{border-bottom:0}
.ph .p-radio{width:16px;height:16px;border:1px solid var(--ink3);border-radius:50%;position:relative}
.ph .p-opt.on .p-radio{border-color:var(--accent)}
.ph .p-opt.on .p-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ph .p-opt-l{font-size:15px}
.ph .p-opt-d{font:12px var(--mono);color:var(--ink3);line-height:1.4;text-align:right}
.ph .p-d-note{font-size:14px;line-height:1.65;color:var(--ink3);margin-top:14px}
.ph .p-url{border:1px solid var(--line);background:var(--panel);padding:12px;font:14px var(--mono);word-break:break-all;border-radius:3px;color:var(--ink);line-height:1.6}
.ph .p-exp{font:12px var(--mono);color:var(--ink2);margin-top:10px;line-height:1.5}
.ph .p-sheet{width:100%;background:var(--bg);border-top:1px solid var(--ink);border-radius:10px 10px 0 0;padding-bottom:10px;overflow:hidden}
.ph .p-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;font:12px var(--mono);color:var(--ink3)}
.ph .p-sheet-text{padding:0 18px 12px;font-size:14px;color:var(--ink2);line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .p-srow-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:14px 18px;border:0;border-top:1px solid var(--line2);background:none;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.ph .p-srow-btn em{font:12px var(--mono);font-style:normal;color:var(--ink3)}
.ph .p-srow-btn.danger{color:var(--danger)}
.ph .p-srow-btn.dis{color:var(--ink3);cursor:default}
.ph .p-srow-btn.dis em{color:var(--ink3)}
.ph .p-toast{position:absolute;left:18px;right:18px;bottom:82px;background:var(--ink);color:var(--bg);font-size:14px;padding:12px 14px;border-radius:3px;z-index:60;text-align:center;line-height:1.4;animation:toastin .18s ease-out}
.ph .p-snack{position:absolute;left:18px;right:18px;bottom:82px;background:var(--ink);color:var(--bg);font-size:14px;border-radius:3px;z-index:60;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;animation:toastin .18s ease-out}
.ph .p-snack span{flex:1;line-height:1.4}
.ph .p-snack button{border:1px solid rgba(255,255,255,.32);background:none;color:inherit;font-size:13px;padding:7px 11px;border-radius:2px;cursor:pointer;min-height:38px;white-space:nowrap}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){.ph .p-dot{animation:none}.ph .p-toast,.ph .p-snack{animation:none}}

/* ============================================================
   desktop
   ============================================================ */
.dt{
  --bg:#F3F0E8;--panel:#FBF9F3;--panel2:#EAE6DA;
  --ink:#191712;--ink2:#5B5446;--ink3:#6B6455;
  --line:#D0CABA;--line2:#E0DBCD;
  --accent:#A8430F;--ok:#2F6B45;--warn:#7A4E0C;--danger:#A03024;
  display:flex;width:1000px;height:700px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;position:relative;overflow:hidden;
}
.dt[data-dark="1"]{
  --bg:#17150F;--panel:#1E1B14;--panel2:#262218;
  --ink:#EDE9DC;--ink2:#B7B0A0;--ink3:#9A9384;
  --line:#3A352B;--line2:#2A2620;
  --accent:#E8823F;--ok:#7ED6A4;--warn:#E0B05A;--danger:#F08A75;
}
.dt-rail{width:200px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px}
.dt-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dt-nav{margin-top:30px;display:flex;flex-direction:column}
.dt-ni{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:12px 10px;cursor:pointer;color:var(--ink2);border-left:2px solid transparent;font-size:14px;min-height:46px;width:100%}
.dt-ni.on{color:var(--ink);border-left-color:var(--accent);background:var(--panel)}
.dt-railfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.dt-ro{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--ink3)}
.dt-ro b{font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dt-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:breathe 2.6s ease-in-out infinite}
.dt-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dt-head{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 28px 16px;border-bottom:1px solid var(--line);gap:16px}
.dt-kick{font:12px var(--mono);color:var(--ink3)}
.dt-title{font-size:26px;font-weight:650;letter-spacing:-.025em;margin-top:5px}
.dt-headright{display:flex;align-items:center;gap:10px}
.dt-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 10px;font:12px var(--mono);color:var(--ink2);white-space:nowrap;min-height:34px}
.dt-search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:0 10px;height:36px;width:200px;color:var(--ink3)}
.dt-search input{border:0;background:none;outline:0;font:14px var(--sans);color:var(--ink);width:100%;min-width:0}
.dt-comp{margin:18px 28px 0;border:1px solid var(--ink);background:var(--panel)}
.dt-comptop{display:flex;justify-content:space-between;padding:7px 11px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--ink2)}
.dt-comp textarea{display:block;width:100%;min-height:58px;max-height:96px;border:0;background:transparent;resize:none;outline:0;padding:10px 11px;font:14px/1.55 var(--sans);color:var(--ink)}
.dt-compbot{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-top:1px solid var(--line)}
.dt-small{font:12px var(--mono);color:var(--ink3)}
.dt-send{font-size:13px;padding:8px 16px;border:0;background:var(--accent);color:#FFF8F0;border-radius:2px;cursor:pointer;min-height:38px}
.dt-send:disabled{background:var(--panel2);color:var(--ink3);cursor:default}
.dt-table{flex:1;min-height:0;display:flex;flex-direction:column;margin:16px 28px 0}
.dt-thead{display:grid;grid-template-columns:150px 1fr 92px 132px;gap:14px;padding:0 0 7px;border-bottom:1px solid var(--ink);font:12px var(--mono);color:var(--ink3)}
.dt-rows{flex:1;overflow-y:auto}
.dt-row{display:grid;grid-template-columns:150px 1fr 92px 132px;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:start}
.dt-dev{font:12px var(--mono);color:var(--ink2);line-height:1.5;word-break:break-word}
.dt-txt{font-size:14px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.dt-time{font:12px var(--mono);color:var(--ink3);padding-top:2px}
.dt-acts{display:flex;justify-content:flex-end}
.dt-mini{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);cursor:pointer;border-radius:2px}
.dt-mini:hover{background:var(--panel2);color:var(--ink)}
.dt-mini.on{color:var(--accent)}
.dt-foot{margin:0 28px;padding:10px 0 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font:12px var(--mono);color:var(--ink3)}
.dt-set{padding:20px 28px;flex:1;overflow-y:auto}
.dt-seclbl{font:12px var(--mono);color:var(--ink3);padding:14px 0 2px}
.dt-setrow{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid var(--line2);font-size:14px}
.dt-setrow .k{font-size:15px}
.dt-setrow .v{margin-left:auto;font:12px var(--mono);color:var(--ink3);text-align:right}
.dt-setrow .sw{width:46px;height:26px;border:1px solid var(--ink);border-radius:3px;background:var(--panel);position:relative;cursor:pointer;flex:none;margin-left:auto}
.dt-setrow .sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink3);border-radius:2px;transition:all .15s}
.dt-setrow .sw.on i{left:22px;background:var(--accent)}
.dt-setrow .sw.on{border-color:var(--accent)}
.dt-seg{display:flex;border:1px solid var(--line);margin-left:auto}
.dt-seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:7px 12px;font-size:13px;color:var(--ink2);cursor:pointer;min-height:38px}
.dt-seg button:last-child{border-right:0}
.dt-seg button.on{background:var(--ink);color:var(--bg)}
.dt-toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:3px;z-index:20;white-space:nowrap}
.dt-veil{position:absolute;inset:0;background:rgba(20,18,12,.44);z-index:30;display:flex;align-items:center;justify-content:center;padding:30px}
.dt-dialog{width:440px;background:var(--bg);border:1px solid var(--ink);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.dt-dialog .p-d-head{padding:18px 20px 13px}
.dt-dialog .dt-d-title{font-size:19px;font-weight:650;margin-top:5px}
.dt-dialog .dt-d-body{padding:14px 20px 16px;font-size:14px;line-height:1.65;color:var(--ink2)}
.dt-dialog .dt-d-foot{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.dt-dialog .dt-d-foot button{flex:1;min-height:46px;font-size:14px;border-radius:3px;cursor:pointer}
.dt-ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.dt-primary{background:var(--ink);border:1px solid var(--ink);color:var(--bg)}

/* ============================================================
   share page preview
   ============================================================ */
.sp{min-height:620px;background:#FBF9F3;color:#191712;font-family:var(--sans);font-size:16px}
.sp-in{max-width:680px;margin:0 auto;padding:56px 60px 64px}
.sp-meta{display:flex;justify-content:space-between;gap:20px;font:12px var(--mono);color:#635C4D;line-height:1.5}
.sp-rule{height:1px;background:#191712;margin:16px 0 30px}
.sp-title{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.35}
.sp-body{margin-top:20px;font-size:16px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:#2A261C}
.sp-exp{margin:0 0 24px;padding:0;border:0;font:12px var(--mono);color:#5B5446;line-height:1.6;display:flex;align-items:center;gap:8px}
.sp-exp:before{content:"";width:6px;height:6px;background:#A8430F;flex:none}
.sp-foot{margin-top:8px;font:12px var(--mono);color:#635C4D;line-height:1.6}
.sp-gone{min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px}
.sp-code{font:600 64px/1 var(--mono);color:#A8430F;letter-spacing:.04em}
.sp-gone h2{font-size:22px;margin-top:22px;font-weight:650;line-height:1.4}
.sp-gone p{font-size:15px;color:#5B5446;margin-top:10px;line-height:1.7;max-width:380px}
.sp-gone .sp-foot{margin-top:32px}
.share-preview-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:34px;border-bottom:1px solid var(--b-line);padding-bottom:12px}
.share-tabs{display:flex;border:1px solid var(--b-line);width:max-content}
.share-tabs button{border:0;border-right:1px solid var(--b-line);background:transparent;padding:8px 14px;font-size:13px;color:var(--b-ink2);cursor:pointer;min-height:36px;white-space:nowrap}
.share-tabs button:last-child{border-right:0}
.share-tabs button.on{background:var(--b-ink);color:var(--b-panel)}
.share-grid{display:flex;flex-wrap:wrap;gap:24px;margin-top:24px}

/* ============================================================
   tokens / components / coverage
   ============================================================ */
.tok-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
.tok-block{border-top:1px solid var(--b-line);padding-top:14px}
.tok-block h4{font-size:15px;font-weight:600;margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatch{border:1px solid var(--b-line2);background:var(--b-panel)}
.swatch i{display:block;height:52px;border-bottom:1px solid var(--b-line2)}
.swatch b{display:block;font:600 12px var(--mono);padding:8px 9px 2px;color:var(--b-ink)}
.swatch span{display:block;font:12px var(--mono);padding:0 9px 9px;color:var(--b-ink3)}
.type-scale{margin-top:6px}
.type-row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--b-line2);padding:11px 0}
.type-row b{font:12px var(--mono);color:var(--b-ink3);width:74px;flex:none;font-weight:500}
.type-row span{color:var(--b-ink);line-height:1.35}
.space-row{display:flex;align-items:flex-end;gap:14px;margin-top:12px}
.space-chip{display:flex;flex-direction:column;align-items:center;gap:7px;font:12px var(--mono);color:var(--b-ink3)}
.space-chip i{display:block;width:var(--s);height:26px;background:var(--b-panel2);border:1px solid var(--b-line)}
.comp-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;padding:20px;border:1px solid var(--b-line2);background:var(--b-panel)}
.c-btn{border:1px solid var(--b-ink);background:var(--b-ink);color:var(--b-panel);font-size:13.5px;padding:10px 18px;border-radius:3px;cursor:pointer;min-height:42px}
.c-btn.ghost{background:transparent;color:var(--b-ink)}
.c-btn.signal{background:var(--b-accent-fill);border-color:var(--b-accent-fill);color:#FFF8F0}
.c-badge{font:12px var(--mono);border:1px solid var(--b-line);padding:3px 7px;border-radius:2px;color:var(--b-ink2)}
.c-badge.warn{color:var(--b-warn);border-color:var(--b-warn)}
.c-badge.fail{color:var(--b-danger);border-color:var(--b-danger)}
.c-sw{width:46px;height:26px;border:1px solid var(--b-ink);border-radius:3px;background:var(--b-panel);position:relative}
.c-sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--b-accent-fill);border-radius:2px}
.c-sw.off i{left:2px;background:var(--b-ink3)}
.c-sw.on i{left:22px}
.c-field{border:1px solid var(--b-line);background:var(--b-panel);padding:10px 12px;font-size:14px;color:var(--b-ink2);min-height:42px;min-width:210px;display:flex;align-items:center}
.c-toast{background:var(--b-ink);color:var(--b-panel);font-size:13.5px;padding:9px 14px;border-radius:3px}
.note-list{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;margin-top:30px}
.note-item{border-top:1px solid var(--b-line2);padding:14px 0}
.note-item b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.note-item span{display:block;font-size:14px;line-height:1.7;color:var(--b-ink2)}
.req-table{width:100%;border-collapse:collapse;margin-top:30px;font-size:14px}
.req-table th,.req-table td{border-bottom:1px solid var(--b-line2);padding:11px 12px;text-align:left;vertical-align:top}
.req-table th{font:12px var(--mono);color:var(--b-ink3);font-weight:500;border-bottom-color:var(--b-line)}
.req-table td:first-child{font:12px var(--mono);color:var(--b-accent);white-space:nowrap;padding-top:13px}
.req-table td:nth-child(2){width:34%;color:var(--b-ink)}
.req-table td:nth-child(3){font:12px var(--mono);color:var(--b-ink2);white-space:nowrap}
.req-table td:nth-child(4){color:var(--b-ink2);line-height:1.6}
.req-table tr:hover td{background:rgba(0,0,0,.02)}
body[data-theme="dark"] .req-table tr:hover td{background:rgba(255,255,255,.03)}
.scope-list{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;margin-top:24px}
.scope-item{border-top:1px solid var(--b-line2);padding:12px 0;font-size:14px;line-height:1.65;color:var(--b-ink2)}
.scope-item b{color:var(--b-ink);font-weight:600}
.foot{margin-top:70px;padding:26px 64px 40px;border-top:1px solid var(--b-line);display:flex;justify-content:space-between;gap:30px;font:12px var(--mono);color:var(--b-ink3)}
.foot span{max-width:560px;line-height:1.7}
.foot-line{display:flex;flex-wrap:wrap;gap:0 14px}
.foot-line span + span{border-left:1px solid var(--b-line);padding-left:14px}
.req-id{display:inline-block;margin-right:7px;line-height:1.9;white-space:nowrap}

/* ============================================================
   final delivery additions
   ============================================================ */
.ph .p-comp.over{border-color:var(--danger)}
.ph .p-compacts{display:flex;align-items:center;gap:8px;flex:none}
.ph .p-srow .p-chev{margin-left:auto;display:flex;color:var(--ink3);flex:none}
.ph .p-srow .v + .p-chev{margin-left:0}
.ph .p-send.ghost{font-size:13px}

/* tool cards */
.ph .p-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph .p-tcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:146px;border:1px solid var(--line);background:var(--panel);padding:12px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.ph .p-tcard:hover{border-color:var(--ink)}
.ph .p-tcard-icon{width:34px;height:34px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);margin-bottom:4px;flex:none}
.ph .p-tcard .nm{font-size:15px;font-weight:600;line-height:1.35}
.ph .p-tcard .ds{font-size:14px;color:var(--ink3);line-height:1.5}
.ph .p-tcard .tag{margin-top:auto;font:12px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:1px 5px}
.ph .p-tcard-note{grid-column:1 / -1;min-height:0;border-style:dashed;background:transparent;cursor:default;padding:12px}
.ph .p-flagcount{font:12px var(--mono);color:var(--ink3);margin-left:auto;align-self:center;white-space:nowrap}

/* appearance preview */
.ph .p-preview{border:1px solid var(--line);background:var(--panel);padding:12px;margin:4px 0 16px}
.ph .p-preview-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph .p-preview-tag{font:12px var(--mono);color:var(--accent);border:1px solid var(--accent);padding:1px 5px;border-radius:2px}
.ph .p-preview-text{margin-top:10px;font-size:15px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.ph .p-preview-meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line2);font:12px var(--mono);color:var(--ink3)}

/* dark contrast on solid signal fills */
.ph[data-dark="1"] .p-send{color:#1B1207}
.ph[data-dark="1"] .p-primary.danger{color:#2A0E08}
.ph[data-dark="1"] .p-snack button{border-color:rgba(0,0,0,.28)}
.dt[data-dark="1"] .dt-send{color:#1B1207}
.dt[data-dark="1"] .dt-primary.danger{color:#2A0E08}
body[data-theme="dark"] .c-btn.signal{color:#1B1207}

/* desktop additions */
.dt-version{font:12px var(--mono);color:var(--ink3);margin:5px 0 0 25px}
.dt-note{font-size:14px;line-height:1.65;color:var(--ink2);margin:9px 0 6px;max-width:660px}
.dt-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.dt-tcard{position:relative;border:1px solid var(--line);background:var(--panel);padding:14px;display:grid;grid-template-columns:36px 1fr;gap:3px 10px;min-height:96px}
.dt-tcard-icon{grid-row:1 / 3;width:36px;height:36px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.dt-tcard b{font-size:14px;font-weight:600;line-height:1.5}
.dt-tcard span{font-size:14px;color:var(--ink3);grid-column:2;line-height:1.45}
.dt-tcard em{position:absolute;top:12px;right:12px;font:12px var(--mono);font-style:normal;color:var(--ink3)}
.dt-textbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;padding:7px 12px;min-height:36px;cursor:pointer;margin-left:auto}
.dt-textbtn.danger{color:var(--danger);border-color:var(--danger)}
.dt-empty{padding:44px 0;text-align:center;font-size:14px;color:var(--ink3)}
.dt-quote{display:block;font-size:14px;color:var(--ink);border-left:2px solid var(--line);padding-left:10px;max-height:76px;overflow:hidden;white-space:pre-wrap;margin-bottom:10px;line-height:1.6}
.dt-quote-note{display:block;font-size:14px}
.dt-d-kicker{font:12px var(--mono);color:var(--accent);line-height:1.4}
.dt-primary.danger{background:var(--danger);border-color:var(--danger);color:#FFF6F3}
.dt-dialog .p-d-head{display:flex;align-items:flex-start;justify-content:space-between}
.dt .dt-rows{scrollbar-width:none}
.dt .dt-rows::-webkit-scrollbar{display:none}
.dt .dt-set::-webkit-scrollbar{display:none}
.dt .dt-set{scrollbar-width:none}

/* share page preview */
.sp[data-dark="1"]{background:#17150F;color:#EDE9DC}
.sp[data-dark="1"] .sp-meta,.sp[data-dark="1"] .sp-foot{color:#A8A294}
.sp[data-dark="1"] .sp-rule{background:#EDE9DC}
.sp[data-dark="1"] .sp-body{color:#DCD6C8}
.sp[data-dark="1"] .sp-exp{color:#B7B0A0}
.sp[data-dark="1"] .sp-exp:before{background:#E8823F}
.sp[data-dark="1"] .sp-code{color:#E8823F}
.sp[data-dark="1"] .sp-gone h2{color:#EDE9DC}
.sp[data-dark="1"] .sp-gone p{color:#B7B0A0}
.sp.prev{height:100%;min-height:0;overflow-y:auto;scrollbar-width:none}
.sp.prev::-webkit-scrollbar{display:none}
.sp.prev .sp-gone{height:100%;min-height:0}

/* board additions */
.stage-aside{width:208px;flex:none;align-self:stretch;border-top:1px solid var(--b-line);padding-top:13px}
.stage-aside b{display:block;font:600 12px var(--mono);color:var(--b-ink);margin-bottom:7px}
.stage-aside p{font-size:14px;line-height:1.7;color:var(--b-ink2);margin-bottom:16px}
.stage-side{width:400px;flex:none;align-self:stretch;border-top:1px solid var(--b-line);padding-top:13px}
.stage-side h4{font-size:15px;font-weight:600;margin-bottom:8px}
.stage-side p{font-size:14px;line-height:1.7;color:var(--b-ink2)}
.stage-side ul{list-style:none;margin-top:10px}
.stage-side li{font-size:14px;line-height:1.65;color:var(--b-ink2);padding:9px 0;border-bottom:1px solid var(--b-line2)}
.stage-side li:before{content:"";display:inline-block;width:5px;height:5px;background:var(--b-accent);margin-right:9px;vertical-align:2px}
.share-panel{width:660px;flex:none;align-self:stretch;border-top:1px solid var(--b-line);padding-top:14px}
.share-panel h4{font-size:15px;font-weight:600;margin-bottom:8px}
.share-panel p{font-size:14px;line-height:1.7;color:var(--b-ink2);margin-bottom:12px;max-width:600px}
.share-states{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px;max-width:420px}
.share-states button{border:1px solid var(--b-line);background:transparent;color:var(--b-ink2);min-height:44px;font-size:13px;cursor:pointer;text-align:left;padding:0 12px}
.share-states button.on{background:var(--b-ink);color:var(--b-panel);border-color:var(--b-ink)}
.share-link{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--b-ink);color:var(--b-ink);padding:0 14px;font-size:13px;text-decoration:none}
.share-link:hover{background:var(--b-ink);color:var(--b-panel)}
.cov-band{display:flex;border:1px solid var(--b-line);margin-top:28px}
.cov-cell{flex:1;padding:14px 16px;border-right:1px solid var(--b-line)}
.cov-cell:last-child{border-right:0}
.cov-cell b{display:block;font:600 22px var(--mono);color:var(--b-ink)}
.cov-cell span{display:block;font-size:13px;color:var(--b-ink2);margin-top:3px}
.tok-note{font-size:14px;line-height:1.7;color:var(--b-ink2);margin-top:16px}
.req-table td:nth-child(3){white-space:normal;line-height:1.7;width:170px}

</style>
</head>
